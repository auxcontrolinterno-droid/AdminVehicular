<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0a2540">
    <title>AutoRegistro - Gestión Vehicular</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================
           PALETA 1: AZUL PROFESIONAL (Corporativo)
           ============================================ */
        :root {
            --color-primary: #0a2540;
            --color-primary-dark: #041a2e;
            --color-primary-light: #1a5f7a;
            
            --color-bg: #f7f9fc;
            --color-bg-card: #ffffff;
            --color-bg-alt: #eef2f6;
            
            --color-text-primary: #1a202c;
            --color-text-secondary: #4a5568;
            --color-text-muted: #718096;
            --color-text-placeholder: #a0aec0;
            
            --color-border: #e2e8f0;
            --color-border-light: #edf2f7;
            
            --color-success: #2e7d32;
            --color-error: #c62828;
            --color-warning: #ed6c02;
            --color-info: #0288d1;
            
            --color-hover-bg: #f0f4f8;
        }

        body {
            background: var(--color-bg);
            min-height: 100vh;
            padding: 32px 24px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--color-text-primary);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            margin-bottom: 48px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--color-primary);
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 0.9rem;
            color: var(--color-text-muted);
        }

        .stats {
            background: var(--color-bg-alt);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            display: inline-block;
            margin-top: 12px;
        }

        /* Estado sincronización */
        .sync-status {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            margin-bottom: 32px;
            padding: 8px 0;
            border-bottom: 1px solid var(--color-border);
        }

        .sync-status.success {
            color: var(--color-success);
        }

        .sync-status.error {
            color: var(--color-error);
        }

        .sync-status.loading {
            color: var(--color-info);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 32px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--color-border);
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 0;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--color-text-muted);
            transition: all 0.2s;
            position: relative;
        }

        .tab-btn.active {
            color: var(--color-primary);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--color-primary);
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Formulario */
        .form-section {
            margin-bottom: 32px;
        }

        .form-section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-text-muted);
            margin-bottom: 16px;
        }

        .field-group {
            margin-bottom: 20px;
        }

        label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--color-text-muted);
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid var(--color-border);
            font-size: 1rem;
            background: transparent;
            transition: all 0.2s;
            color: var(--color-text-primary);
        }

        input::placeholder {
            color: var(--color-text-placeholder);
        }

        input:focus {
            outline: none;
            border-bottom-color: var(--color-primary-light);
        }

        /* Botones */
        .btn {
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--color-primary);
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.97);
            background: var(--color-primary-dark);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--color-border);
            color: var(--color-text-secondary);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        /* Buscador */
        .search-section {
            margin-bottom: 32px;
        }

        .search-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-text-muted);
            margin-bottom: 12px;
            display: block;
        }

        .search-wrapper {
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-placeholder);
            font-size: 0.9rem;
        }

        .search-wrapper input {
            padding: 14px 0 14px 28px;
            border: none;
            border-bottom: 1px solid var(--color-border);
            width: 100%;
            background: transparent;
            font-size: 1rem;
        }

        .search-wrapper input:focus {
            border-bottom-color: var(--color-primary-light);
        }

        /* Resultados */
        .results-list {
            margin-top: 24px;
        }

        .result-card {
            background: var(--color-bg-card);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            border: 1px solid var(--color-border-light);
            transition: all 0.2s;
        }

        .result-card:hover {
            border-color: var(--color-border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .result-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 16px;
        }

        .result-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .detail-row {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
        }

        .detail-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--color-text-muted);
            min-width: 100px;
        }

        .detail-value {
            font-size: 0.95rem;
            color: var(--color-text-secondary);
            font-weight: 500;
        }

        .sub-section {
            margin-top: 16px;
            padding-top: 8px;
            border-top: 1px solid var(--color-border-light);
        }

        .sub-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-text-muted);
            margin: 8px 0 12px 0;
        }

        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            background: var(--color-bg-alt);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--color-text-secondary);
        }

        .result-actions {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--color-border-light);
        }

        .action-link {
            background: none;
            border: none;
            font-size: 0.8rem;
            color: var(--color-text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0;
            transition: color 0.2s;
        }

        .action-link.edit:hover {
            color: var(--color-primary-light);
        }

        .action-link.delete:hover {
            color: var(--color-error);
        }

        /* Listas dinámicas */
        .dynamic-list {
            margin: 8px 0;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--color-border-light);
        }

        .btn-agregar {
            background: none;
            border: none;
            padding: 10px 0;
            font-size: 0.8rem;
            color: var(--color-text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            transition: color 0.2s;
        }

        .btn-agregar:hover {
            color: var(--color-primary-light);
        }

        .empty-result {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-muted);
        }

        .highlight {
            background: #fef9c3;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--color-border);
            margin-top: 24px;
            width: auto;
        }

        #loadingToast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--color-primary);
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.8rem;
            display: none;
            z-index: 1000;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: var(--color-text-muted);
            padding: 32px 0 16px;
            border-top: 1px solid var(--color-border);
            margin-top: 16px;
        }

        #listaContainer {
            max-height: 60vh;
            overflow-y: auto;
        }

        @media (max-width: 600px) {
            body {
                padding: 24px 20px;
            }
            .detail-label {
                min-width: 80px;
            }
            .tabs {
                gap: 24px;
            }
            .result-card {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>AutoRegistro</h1>
        <p>Gestión de vehículos y estudiantes</p>
        <div class="stats" id="globalStats">Cargando...</div>
    </div>

    <div id="syncStatus" class="sync-status loading">
        <i class="fas fa-spinner fa-pulse"></i> Cargando datos...
    </div>

    <div class="tabs">
        <button class="tab-btn" data-tab="registrar">Registrar</button>
        <button class="tab-btn active" data-tab="buscar">Buscar</button>
    </div>

    <div id="tab-registrar" class="tab-panel">
        <div class="form-section">
            <div class="form-section-title">DATOS DEL DUEÑO</div>
            <input type="hidden" id="editId" value="">
            
            <div class="field-group">
                <label>Nombre completo *</label>
                <input type="text" id="nombre" placeholder="Ej: María González">
            </div>

            <div class="field-group">
                <label>Teléfono</label>
                <input type="tel" id="telefono" placeholder="Ej: 555-1234">
            </div>

            <div class="field-group">
                <label>Identificación</label>
                <input type="text" id="identificacion" placeholder="Cédula / DNI">
            </div>

            <div class="field-group">
                <label>Correo electrónico</label>
                <input type="email" id="correo" placeholder="correo@ejemplo.com">
            </div>
        </div>

        <div class="form-section">
            <div class="form-section-title">ESTUDIANTES</div>
            <div class="dynamic-list">
                <div id="listaEstudiantes"></div>
                <button type="button" class="btn-agregar" id="agregarEstudianteBtn">
                    <i class="fas fa-plus-circle"></i> Agregar estudiante
                </button>
            </div>
        </div>

        <div class="form-section">
            <div class="form-section-title">VEHÍCULOS</div>
            <div class="dynamic-list">
                <div id="listaVehiculos"></div>
                <button type="button" class="btn-agregar" id="agregarVehiculoBtn">
                    <i class="fas fa-plus-circle"></i> Agregar vehículo
                </button>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" id="guardarBtn"><i class="fas fa-save"></i> Guardar</button>
            <button class="btn btn-outline" id="cancelarBtn"><i class="fas fa-times"></i> Cancelar</button>
        </div>
    </div>

    <div id="tab-buscar" class="tab-panel active">
        <div class="search-section">
            <div class="search-label">BUSCAR POR NOMBRE, PLACA O ESTUDIANTE</div>
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="buscarInput" placeholder="Buscar ahora...">
            </div>
        </div>

        <div id="listaContainer">
            <div class="empty-result">
                <i class="fas fa-info-circle"></i>
                <div>Cargando datos...</div>
            </div>
        </div>
        
        <button id="refreshBtn" class="btn refresh-btn">
            <i class="fas fa-sync-alt"></i> Sincronizar
        </button>
    </div>

    <footer>
        Datos sincronizados desde Google Sheets
    </footer>
</div>
<div id="loadingToast"><i class="fas fa-circle-notch fa-spin"></i> Procesando...</div>

<script>
    // ============================================
    // URL DE GOOGLE SHEETS
    // ============================================
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXXEvohQRS2kQXv4VbfI6Rjwr4D7xahuOJikzsr0BTlpDYHlTcDtRe2FU1KAcSMWnXKohHLnFjRXmC/pub?gid=0&single=true&output=csv";
    
    // ============================================

    let owners = [];
    let filtroActual = "";
    let estudiantesTemp = [];
    let vehiculosTemp = [];

    // Elementos DOM
    const listaContainer = document.getElementById("listaContainer");
    const buscarInput = document.getElementById("buscarInput");
    const globalStatsSpan = document.getElementById("globalStats");
    const syncStatus = document.getElementById("syncStatus");
    const refreshBtn = document.getElementById("refreshBtn");
    const editId = document.getElementById("editId");
    const nombre = document.getElementById("nombre");
    const telefono = document.getElementById("telefono");
    const identificacion = document.getElementById("identificacion");
    const correo = document.getElementById("correo");
    const guardarBtn = document.getElementById("guardarBtn");
    const cancelarBtn = document.getElementById("cancelarBtn");
    const loadingToast = document.getElementById("loadingToast");
    const listaEstudiantes = document.getElementById("listaEstudiantes");
    const listaVehiculos = document.getElementById("listaVehiculos");
    const agregarEstudianteBtn = document.getElementById("agregarEstudianteBtn");
    const agregarVehiculoBtn = document.getElementById("agregarVehiculoBtn");

    function showLoading(show) {
        loadingToast.style.display = show ? "flex" : "none";
    }

    function formatearPlaca(texto) {
        if (!texto) return "";
        let limpio = texto.toUpperCase().replace(/\s/g, "").replace(/-/g, "");
        if (limpio.length > 3) {
            return limpio.substring(0, 3) + "-" + limpio.substring(3, 8);
        }
        return limpio;
    }

    function parseCSV(csvText) {
        const lines = csvText.split(/\r?\n/);
        if (lines.length < 2) return [];
        
        const data = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            
            const values = [];
            let inQuote = false;
            let currentValue = "";
            
            for (let j = 0; j < lines[i].length; j++) {
                const char = lines[i][j];
                if (char === '"') {
                    inQuote = !inQuote;
                } else if (char === "," && !inQuote) {
                    values.push(currentValue);
                    currentValue = "";
                } else {
                    currentValue += char;
                }
            }
            values.push(currentValue);
            
            if (values.length >= 3) {
                const estudiantesRaw = values[5] || "";
                const estudiantes = estudiantesRaw.split(";").filter(s => s.trim()).map(s => {
                    const [nombre, grado] = s.split("|");
                    return { nombre: nombre || "", grado: grado || "" };
                });
                
                const vehiculosRaw = values[6] || "";
                const vehiculos = vehiculosRaw.split(";").filter(s => s.trim()).map(s => {
                    const [placa, color] = s.split("|");
                    return { placa: placa || "", color: color || "" };
                });
                
                data.push({
                    id: values[0] ? values[0].replace(/^"|"$/g, '') : Date.now().toString(),
                    nombre: values[1] ? values[1].replace(/^"|"$/g, '') : "",
                    telefono: values[2] ? values[2].replace(/^"|"$/g, '') : "",
                    identificacion: values[3] ? values[3].replace(/^"|"$/g, '') : "",
                    correo: values[4] ? values[4].replace(/^"|"$/g, '') : "",
                    estudiantes: estudiantes,
                    vehiculos: vehiculos,
                    actualizado: values[7] ? values[7].replace(/^"|"$/g, '') : new Date().toISOString()
                });
            }
        }
        
        return data;
    }

    async function cargarDesdeSheets() {
        showLoading(true);
        syncStatus.className = "sync-status loading";
        syncStatus.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Cargando datos...`;
        
        try {
            const response = await fetch(CSV_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const csvText = await response.text();
            const datos = parseCSV(csvText);
            
            if (datos.length > 0) {
                owners = datos;
                syncStatus.className = "sync-status success";
                syncStatus.innerHTML = `<i class="fas fa-check-circle"></i> ${owners.length} registros cargados`;
                mostrarMensaje(`${owners.length} registros cargados`);
            } else {
                syncStatus.className = "sync-status error";
                syncStatus.innerHTML = `<i class="fas fa-exclamation-triangle"></i> No se encontraron datos`;
                owners = [];
            }
        } catch (error) {
            syncStatus.className = "sync-status error";
            syncStatus.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Error: ${error.message}`;
            owners = [];
        } finally {
            showLoading(false);
            actualizarEstadisticas();
            aplicarBusqueda();
        }
    }

    function guardarBackupLocal() {
        localStorage.setItem("autoregistro_backup", JSON.stringify(owners));
    }

    function cargarBackupLocal() {
        const backup = localStorage.getItem("autoregistro_backup");
        if (backup && owners.length === 0) {
            try {
                owners = JSON.parse(backup);
                syncStatus.className = "sync-status success";
                syncStatus.innerHTML = `<i class="fas fa-database"></i> ${owners.length} registros (local)`;
                actualizarEstadisticas();
                aplicarBusqueda();
            } catch(e) {}
        }
    }

    function mostrarMensaje(mensaje, esError = false) {
        const toast = document.createElement('div');
        toast.style.cssText = `
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: ${esError ? '#c62828' : '#2e7d32'}; color: white;
            padding: 10px 24px; border-radius: 40px; font-size: 0.8rem;
            z-index: 1000; animation: slideUp 0.3s ease;
        `;
        toast.innerHTML = `<i class="fas ${esError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${mensaje}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    function renderizarListaEstudiantes() {
        if (estudiantesTemp.length === 0) {
            listaEstudiantes.innerHTML = '<div style="color:#a0aec0; padding:12px 0;">Sin estudiantes</div>';
            return;
        }
        let html = '';
        estudiantesTemp.forEach((est, index) => {
            html += `<div class="list-item">
                        <div><strong>${escapeHtml(est.nombre)}</strong> ${est.grado ? `<span style="color:#718096; margin-left:8px;">📚 ${escapeHtml(est.grado)}</span>` : ''}</div>
                        <div style="display:flex; gap:12px;">
                            <i class="fas fa-edit edit-estudiante" data-index="${index}" style="color:#a0aec0; cursor:pointer;"></i>
                            <i class="fas fa-trash delete-estudiante" data-index="${index}" style="color:#a0aec0; cursor:pointer;"></i>
                        </div>
                    </div>`;
        });
        listaEstudiantes.innerHTML = html;
        
        document.querySelectorAll('.edit-estudiante').forEach(icon => {
            icon.onclick = () => {
                const idx = parseInt(icon.dataset.index);
                const nuevoNombre = prompt("Nombre:", estudiantesTemp[idx].nombre);
                if (nuevoNombre?.trim()) {
                    estudiantesTemp[idx].nombre = nuevoNombre.trim();
                    estudiantesTemp[idx].grado = prompt("Grado:", estudiantesTemp[idx].grado || "") || "";
                    renderizarListaEstudiantes();
                }
            };
        });
        document.querySelectorAll('.delete-estudiante').forEach(icon => {
            icon.onclick = () => {
                if (confirm("¿Eliminar?")) {
                    estudiantesTemp.splice(parseInt(icon.dataset.index), 1);
                    renderizarListaEstudiantes();
                }
            };
        });
    }

    function renderizarListaVehiculos() {
        if (vehiculosTemp.length === 0) {
            listaVehiculos.innerHTML = '<div style="color:#a0aec0; padding:12px 0;">Sin vehículos</div>';
            return;
        }
        let html = '';
        vehiculosTemp.forEach((veh, index) => {
            html += `<div class="list-item">
                        <div><strong>${escapeHtml(veh.placa)}</strong> ${veh.color ? `<span style="color:#718096; margin-left:8px;">🎨 ${escapeHtml(veh.color)}</span>` : ''}</div>
                        <div style="display:flex; gap:12px;">
                            <i class="fas fa-edit edit-vehiculo" data-index="${index}" style="color:#a0aec0; cursor:pointer;"></i>
                            <i class="fas fa-trash delete-vehiculo" data-index="${index}" style="color:#a0aec0; cursor:pointer;"></i>
                        </div>
                    </div>`;
        });
        listaVehiculos.innerHTML = html;
        
        document.querySelectorAll('.edit-vehiculo').forEach(icon => {
            icon.onclick = () => {
                const idx = parseInt(icon.dataset.index);
                const nuevaPlaca = prompt("Placa:", vehiculosTemp[idx].placa);
                if (nuevaPlaca?.trim()) {
                    const nuevaPlacaForm = formatearPlaca(nuevaPlaca.trim());
                    if (vehiculosTemp.some((v, i) => i !== idx && v.placa === nuevaPlacaForm)) {
                        mostrarMensaje("Placa duplicada", true);
                        return;
                    }
                    vehiculosTemp[idx].placa = nuevaPlacaForm;
                    vehiculosTemp[idx].color = prompt("Color:", vehiculosTemp[idx].color || "") || "";
                    renderizarListaVehiculos();
                }
            };
        });
        document.querySelectorAll('.delete-vehiculo').forEach(icon => {
            icon.onclick = () => {
                if (confirm("¿Eliminar?")) {
                    vehiculosTemp.splice(parseInt(icon.dataset.index), 1);
                    renderizarListaVehiculos();
                }
            };
        });
    }

    function agregarEstudiante() {
        const nombreEst = prompt("Nombre del estudiante:");
        if (nombreEst?.trim()) {
            estudiantesTemp.push({ 
                nombre: nombreEst.trim(), 
                grado: prompt("Grado:") || "" 
            });
            renderizarListaEstudiantes();
        }
    }

    function agregarVehiculo() {
        const placa = prompt("Placa del vehículo:");
        if (placa?.trim()) {
            const placaForm = formatearPlaca(placa.trim());
            if (vehiculosTemp.some(v => v.placa === placaForm)) {
                mostrarMensaje("Placa duplicada", true);
                return;
            }
            vehiculosTemp.push({ 
                placa: placaForm, 
                color: prompt("Color:") || "" 
            });
            renderizarListaVehiculos();
        }
    }

    agregarEstudianteBtn.onclick = agregarEstudiante;
    agregarVehiculoBtn.onclick = agregarVehiculo;

    function limpiarFormulario() {
        editId.value = "";
        nombre.value = "";
        telefono.value = "";
        identificacion.value = "";
        correo.value = "";
        estudiantesTemp = [];
        vehiculosTemp = [];
        renderizarListaEstudiantes();
        renderizarListaVehiculos();
    }

    function guardarOwner() {
        const nombreValue = nombre.value.trim();
        if (!nombreValue) { mostrarMensaje("Nombre obligatorio", true); return; }
        if (vehiculosTemp.length === 0) { mostrarMensaje("Agregue un vehículo", true); return; }
        
        const idActual = editId.value;
        const nuevoOwner = {
            id: idActual || Date.now().toString(),
            nombre: nombreValue,
            telefono: telefono.value.trim() || "",
            identificacion: identificacion.value.trim() || "",
            correo: correo.value.trim() || "",
            estudiantes: estudiantesTemp,
            vehiculos: vehiculosTemp,
            actualizado: new Date().toISOString()
        };
        
        if (idActual) {
            const index = owners.findIndex(o => o.id === idActual);
            if (index !== -1) {
                owners[index] = nuevoOwner;
                mostrarMensaje("Actualizado");
            }
        } else {
            owners.push(nuevoOwner);
            mostrarMensaje("Guardado");
        }
        
        guardarBackupLocal();
        limpiarFormulario();
        actualizarEstadisticas();
        aplicarBusqueda();
    }

    function eliminarOwner(id, nombreOwner) {
        if (confirm(`¿Eliminar a "${nombreOwner}"?`)) {
            owners = owners.filter(o => o.id !== id);
            guardarBackupLocal();
            actualizarEstadisticas();
            aplicarBusqueda();
            mostrarMensaje("Eliminado");
        }
    }

    function editarOwner(owner) {
        editId.value = owner.id;
        nombre.value = owner.nombre || "";
        telefono.value = owner.telefono || "";
        identificacion.value = owner.identificacion || "";
        correo.value = owner.correo || "";
        estudiantesTemp = owner.estudiantes ? [...owner.estudiantes] : [];
        vehiculosTemp = owner.vehiculos ? [...owner.vehiculos] : [];
        renderizarListaEstudiantes();
        renderizarListaVehiculos();
        document.querySelector('.tab-btn[data-tab="registrar"]').click();
    }

    function aplicarBusqueda() {
        const termino = buscarInput.value.trim().toLowerCase();
        let filtrados = [...owners];
        if (termino) {
            filtrados = owners.filter(owner => 
                owner.nombre?.toLowerCase().includes(termino) ||
                owner.telefono?.toLowerCase().includes(termino) ||
                owner.identificacion?.toLowerCase().includes(termino) ||
                owner.vehiculos?.some(v => v.placa?.toLowerCase().includes(termino)) ||
                owner.estudiantes?.some(e => e.nombre?.toLowerCase().includes(termino))
            );
        }
        renderizarResultados(filtrados, termino);
    }

    function renderizarResultados(filtrados, termino) {
        if (filtrados.length === 0) {
            listaContainer.innerHTML = `<div class="empty-result"><i class="fas fa-search"></i><div>Sin resultados</div></div>`;
            return;
        }
        
        let html = "";
        filtrados.forEach(owner => {
            html += `
            <div class="result-card">
                <div class="result-name">${resaltarTexto(owner.nombre, termino)}</div>
                <div class="result-details">`;
            
            if (owner.identificacion) {
                html += `<div class="detail-row">
                            <div class="detail-label">IDENTIFICACIÓN</div>
                            <div class="detail-value">${resaltarTexto(owner.identificacion, termino)}</div>
                        </div>`;
            }
            
            if (owner.telefono) {
                html += `<div class="detail-row">
                            <div class="detail-label">TELÉFONO</div>
                            <div class="detail-value">${resaltarTexto(owner.telefono, termino)}</div>
                        </div>`;
            }
            
            if (owner.correo) {
                html += `<div class="detail-row">
                            <div class="detail-label">CORREO</div>
                            <div class="detail-value">${escapeHtml(owner.correo)}</div>
                        </div>`;
            }
            
            if (owner.estudiantes && owner.estudiantes.length > 0) {
                html += `<div class="sub-section">
                            <div class="sub-title">ESTUDIANTES</div>
                            <div class="badge-list">
                                ${owner.estudiantes.map(est => `<span class="badge">${resaltarTexto(est.nombre, termino)}${est.grado ? ` · ${escapeHtml(est.grado)}` : ''}</span>`).join('')}
                            </div>
                        </div>`;
            }
            
            if (owner.vehiculos && owner.vehiculos.length > 0) {
                html += `<div class="sub-section">
                            <div class="sub-title">VEHÍCULOS</div>
                            <div class="badge-list">
                                ${owner.vehiculos.map(veh => `<span class="badge"><i class="fas fa-car"></i> ${resaltarTexto(veh.placa, termino)}${veh.color ? ` · ${escapeHtml(veh.color)}` : ''}</span>`).join('')}
                            </div>
                        </div>`;
            }
            
            html += `</div>
                <div class="result-actions">
                    <button class="action-link edit" onclick="window.editarOwnerDesdeGlobal('${owner.id}', ${JSON.stringify(owner).replace(/"/g, '&quot;')})">
                        <i class="fas fa-edit"></i> Editar
                    </button>
                    <button class="action-link delete" onclick="window.eliminarOwnerDesdeGlobal('${owner.id}', '${escapeHtml(owner.nombre)}')">
                        <i class="fas fa-trash"></i> Eliminar
                    </button>
                </div>
            </div>`;
        });
        listaContainer.innerHTML = html;
    }

    window.editarOwnerDesdeGlobal = function(id, owner) {
        editarOwner(owner);
    };
    
    window.eliminarOwnerDesdeGlobal = function(id, nombre) {
        eliminarOwner(id, nombre);
    };

    function resaltarTexto(texto, busqueda) {
        if (!busqueda || !texto) return escapeHtml(texto);
        const regex = new RegExp(`(${busqueda.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return escapeHtml(texto).replace(regex, '<span class="highlight">$1</span>');
    }

    function actualizarEstadisticas() {
        const totalOwners = owners.length;
        const totalVehiculos = owners.reduce((acc, o) => acc + (o.vehiculos?.length || 0), 0);
        globalStatsSpan.innerHTML = `${totalOwners} dueños · ${totalVehiculos} vehículos`;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    // Pestañas
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabPanels = document.querySelectorAll('.tab-panel');
    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const tabId = btn.dataset.tab;
            tabBtns.forEach(b => b.classList.remove('active'));
            tabPanels.forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        });
    });

    // Eventos
    guardarBtn.onclick = guardarOwner;
    cancelarBtn.onclick = limpiarFormulario;
    buscarInput.oninput = () => aplicarBusqueda();
    refreshBtn.onclick = () => cargarDesdeSheets();

    // Inicializar
    cargarDesdeSheets();
    cargarBackupLocal();
</script>
</body>
</html>
