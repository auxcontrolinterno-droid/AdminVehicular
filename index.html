<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f0">
    <title>AutoRegistro - Gestión Vehicular</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f5f5f0;
            min-height: 100vh;
            padding: 20px 16px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header minimalista */
        .header {
            background: transparent;
            padding: 8px 0 20px 0;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 1px solid #e0e0d8;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .header h1 i {
            color: #8aa0b0;
            font-size: 1.4rem;
        }

        .stats {
            background: #e8e8e2;
            padding: 6px 16px;
            border-radius: 30px;
            color: #5a6e7c;
            font-weight: 500;
            font-size: 0.85rem;
        }

        /* Estado de sincronización */
        .sync-status {
            background: transparent;
            padding: 0 0 16px 0;
            margin-bottom: 8px;
            text-align: left;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #8aa0b0;
            border-bottom: 1px solid #e0e0d8;
        }

        .sync-status.success {
            color: #4a7c59;
        }

        .sync-status.error {
            color: #c97a7a;
        }

        .sync-status.loading {
            color: #5a7c9e;
        }

        /* Tabs - más sutiles */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid #e0e0d8;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 12px 20px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            color: #8a9aa8;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            position: relative;
        }

        .tab-btn.active {
            color: #2c3e50;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: #2c3e50;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Formulario - sin bordes pesados */
        .form-card {
            background: transparent;
            padding: 0;
        }

        .form-title {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 24px;
            color: #2c3e50;
        }

        .field-group {
            margin-bottom: 20px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #8a9aa8;
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 14px 0;
            border: none;
            border-bottom: 1px solid #e0e0d8;
            font-size: 1rem;
            background: transparent;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-bottom-color: #8aa0b0;
        }

        /* Botones */
        .btn {
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #2c3e50;
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #d0d8e0;
            color: #7a8a98;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        /* Buscador */
        .search-wrapper {
            position: relative;
            margin-bottom: 28px;
        }

        .search-wrapper i {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: #a0b0bc;
        }

        .search-wrapper input {
            padding: 14px 0 14px 28px;
            border: none;
            border-bottom: 1px solid #e0e0d8;
            width: 100%;
            background: transparent;
        }

        /* TARJETAS DE RESULTADOS - SIN ENCAPSULAMIENTO */
        .result-item {
            border-bottom: 1px solid #e0e0d8;
            padding: 24px 0;
            transition: all 0.2s;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        /* Header del resultado - más fluido */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
        }

        .owner-info {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .owner-avatar {
            width: 56px;
            height: 56px;
            background: #e8e8e2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5a6e7c;
            font-weight: 500;
            font-size: 1.5rem;
        }

        .owner-name {
            font-size: 1.3rem;
            font-weight: 500;
            color: #2c3e50;
        }

        .owner-id {
            font-size: 0.75rem;
            color: #8a9aa8;
            margin-top: 4px;
        }

        .stats-badges {
            display: flex;
            gap: 12px;
        }

        .stat-badge {
            background: #e8e8e2;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #5a6e7c;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Grid de información - más abierta */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .info-item {
            background: transparent;
            padding: 0;
        }

        .info-label {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #9aacba;
            margin-bottom: 6px;
        }

        .info-value {
            font-size: 1rem;
            font-weight: 500;
            color: #2c3e50;
        }

        /* Secciones - sin recuadros */
        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin: 20px 0 16px 0;
        }

        .section-block {
            background: transparent;
            padding: 0;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #9aacba;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-line {
            padding: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .item-placa {
            font-family: monospace;
            font-weight: 500;
            font-size: 0.95rem;
            color: #5a7c9e;
        }

        .item-color {
            font-size: 0.8rem;
            color: #8aa0b0;
        }

        /* Botones de acción - más sutiles */
        .result-actions {
            display: flex;
            gap: 16px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e0e0d8;
        }

        .action-button {
            background: transparent;
            padding: 8px 0;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            border: none;
            transition: all 0.2s;
        }

        .action-button.edit {
            color: #5a7c9e;
        }

        .action-button.delete {
            color: #c97a7a;
        }

        .action-button:active {
            opacity: 0.6;
        }

        /* Listas dinámicas del formulario */
        .dynamic-list {
            background: transparent;
            padding: 0;
            margin: 8px 0;
        }

        .list-item {
            background: transparent;
            padding: 12px 0;
            margin-bottom: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0d8;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .btn-agregar {
            background: transparent;
            border: none;
            padding: 12px 0;
            width: 100%;
            text-align: left;
            color: #8aa0b0;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .empty-result {
            text-align: center;
            padding: 60px 20px;
            color: #aabbc8;
        }

        .empty-result i {
            font-size: 2.5rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .highlight {
            background: #f0ede0;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid #d0d8e0;
            margin-top: 24px;
            width: auto;
            padding: 10px 24px;
        }

        #loadingToast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c3e50;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.8rem;
            display: none;
            z-index: 1000;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #aabbc8;
            padding: 32px 0 16px;
            border-top: 1px solid #e0e0d8;
            margin-top: 16px;
        }

        #listaContainer {
            max-height: 65vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        @media (max-width: 640px) {
            .result-header {
                flex-direction: column;
            }
            .sections-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-car"></i> AutoRegistro</h1>
        <div class="stats" id="globalStats">Cargando...</div>
    </div>

    <div id="syncStatus" class="sync-status loading">
        <i class="fas fa-spinner fa-pulse"></i> Cargando datos...
    </div>

    <div class="tabs">
        <button class="tab-btn" data-tab="registrar">
            <i class="fas fa-plus-circle"></i> Registrar
        </button>
        <button class="tab-btn active" data-tab="buscar">
            <i class="fas fa-search"></i> Buscar
        </button>
    </div>

    <div id="tab-registrar" class="tab-panel">
        <div class="form-card">
            <div class="form-title">Nuevo Dueño</div>
            <input type="hidden" id="editId" value="">
            
            <div class="field-group">
                <label>Nombre completo *</label>
                <input type="text" id="nombre" placeholder="María González">
            </div>

            <div class="field-group">
                <label>Teléfono</label>
                <input type="tel" id="telefono" placeholder="555-1234">
            </div>

            <div class="field-group">
                <label>Identificación</label>
                <input type="text" id="identificacion" placeholder="Cédula / DNI">
            </div>

            <div class="field-group">
                <label>Correo electrónico</label>
                <input type="email" id="correo" placeholder="correo@ejemplo.com">
            </div>

            <div style="margin: 24px 0 8px 0;">
                <span style="font-weight: 500; color: #5a6e7c;">Estudiantes</span>
            </div>
            <div class="dynamic-list">
                <div id="listaEstudiantes"></div>
                <button type="button" class="btn-agregar" id="agregarEstudianteBtn">
                    <i class="fas fa-plus-circle"></i> Agregar estudiante
                </button>
            </div>

            <div style="margin: 24px 0 8px 0;">
                <span style="font-weight: 500; color: #5a6e7c;">Vehículos</span>
            </div>
            <div class="dynamic-list">
                <div id="listaVehiculos"></div>
                <button type="button" class="btn-agregar" id="agregarVehiculoBtn">
                    <i class="fas fa-plus-circle"></i> Agregar vehículo
                </button>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="guardarBtn"><i class="fas fa-save"></i> Guardar</button>
                <button class="btn btn-outline" id="cancelarBtn"><i class="fas fa-times"></i> Cancelar</button>
            </div>
        </div>
    </div>

    <div id="tab-buscar" class="tab-panel active">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="buscarInput" placeholder="Buscar por nombre, placa o estudiante...">
        </div>

        <div id="listaContainer">
            <div class="empty-result">
                <i class="fas fa-info-circle"></i>
                <div>Cargando datos...</div>
            </div>
        </div>
        
        <button id="refreshBtn" class="btn refresh-btn">
            <i class="fas fa-sync-alt"></i> Sincronizar con Google Sheets
        </button>
    </div>

    <footer>
        <i class="fas fa-cloud-download-alt"></i> Datos sincronizados desde Google Sheets
    </footer>
</div>
<div id="loadingToast"><i class="fas fa-circle-notch fa-spin"></i> Procesando...</div>

<script>
    // ============================================
    // URL DE GOOGLE SHEETS
    // ============================================
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXXEvohQRS2kQXv4VbfI6Rjwr4D7xahuOJikzsr0BTlpDYHlTcDtRe2FU1KAcSMWnXKohHLnFjRXmC/pub?gid=0&single=true&output=csv";
    
    // ============================================

    let owners = [];
    let filtroActual = "";
    let estudiantesTemp = [];
    let vehiculosTemp = [];

    // Elementos DOM
    const listaContainer = document.getElementById("listaContainer");
    const buscarInput = document.getElementById("buscarInput");
    const globalStatsSpan = document.getElementById("globalStats");
    const syncStatus = document.getElementById("syncStatus");
    const refreshBtn = document.getElementById("refreshBtn");
    const editId = document.getElementById("editId");
    const nombre = document.getElementById("nombre");
    const telefono = document.getElementById("telefono");
    const identificacion = document.getElementById("identificacion");
    const correo = document.getElementById("correo");
    const guardarBtn = document.getElementById("guardarBtn");
    const cancelarBtn = document.getElementById("cancelarBtn");
    const loadingToast = document.getElementById("loadingToast");
    const listaEstudiantes = document.getElementById("listaEstudiantes");
    const listaVehiculos = document.getElementById("listaVehiculos");
    const agregarEstudianteBtn = document.getElementById("agregarEstudianteBtn");
    const agregarVehiculoBtn = document.getElementById("agregarVehiculoBtn");

    function showLoading(show) {
        loadingToast.style.display = show ? "flex" : "none";
    }

    function formatearPlaca(texto) {
        if (!texto) return "";
        let limpio = texto.toUpperCase().replace(/\s/g, "").replace(/-/g, "");
        if (limpio.length > 3) {
            return limpio.substring(0, 3) + "-" + limpio.substring(3, 8);
        }
        return limpio;
    }

    function parseCSV(csvText) {
        const lines = csvText.split(/\r?\n/);
        if (lines.length < 2) return [];
        
        const data = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            
            const values = [];
            let inQuote = false;
            let currentValue = "";
            
            for (let j = 0; j < lines[i].length; j++) {
                const char = lines[i][j];
                if (char === '"') {
                    inQuote = !inQuote;
                } else if (char === "," && !inQuote) {
                    values.push(currentValue);
                    currentValue = "";
                } else {
                    currentValue += char;
                }
            }
            values.push(currentValue);
            
            if (values.length >= 3) {
                const estudiantesRaw = values[5] || "";
                const estudiantes = estudiantesRaw.split(";").filter(s => s.trim()).map(s => {
                    const [nombre, grado] = s.split("|");
                    return { nombre: nombre || "", grado: grado || "" };
                });
                
                const vehiculosRaw = values[6] || "";
                const vehiculos = vehiculosRaw.split(";").filter(s => s.trim()).map(s => {
                    const [placa, color] = s.split("|");
                    return { placa: placa || "", color: color || "" };
                });
                
                data.push({
                    id: values[0] ? values[0].replace(/^"|"$/g, '') : Date.now().toString(),
                    nombre: values[1] ? values[1].replace(/^"|"$/g, '') : "",
                    telefono: values[2] ? values[2].replace(/^"|"$/g, '') : "",
                    identificacion: values[3] ? values[3].replace(/^"|"$/g, '') : "",
                    correo: values[4] ? values[4].replace(/^"|"$/g, '') : "",
                    estudiantes: estudiantes,
                    vehiculos: vehiculos,
                    actualizado: values[7] ? values[7].replace(/^"|"$/g, '') : new Date().toISOString()
                });
            }
        }
        
        return data;
    }

    async function cargarDesdeSheets() {
        showLoading(true);
        syncStatus.className = "sync-status loading";
        syncStatus.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Cargando datos...`;
        
        try {
            const response = await fetch(CSV_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const csvText = await response.text();
            const datos = parseCSV(csvText);
            
            if (datos.length > 0) {
                owners = datos;
                syncStatus.className = "sync-status success";
                syncStatus.innerHTML = `<i class="fas fa-check-circle"></i> ${owners.length} registros cargados`;
                mostrarMensaje(`${owners.length} registros cargados`);
            } else {
                syncStatus.className = "sync-status error";
                syncStatus.innerHTML = `<i class="fas fa-exclamation-triangle"></i> No se encontraron datos`;
                owners = [];
            }
        } catch (error) {
            syncStatus.className = "sync-status error";
            syncStatus.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Error: ${error.message}`;
            owners = [];
        } finally {
            showLoading(false);
            actualizarEstadisticas();
            aplicarBusqueda();
        }
    }

    function guardarBackupLocal() {
        localStorage.setItem("autoregistro_backup", JSON.stringify(owners));
    }

    function cargarBackupLocal() {
        const backup = localStorage.getItem("autoregistro_backup");
        if (backup && owners.length === 0) {
            try {
                owners = JSON.parse(backup);
                syncStatus.className = "sync-status success";
                syncStatus.innerHTML = `<i class="fas fa-database"></i> ${owners.length} registros (local)`;
                actualizarEstadisticas();
                aplicarBusqueda();
            } catch(e) {}
        }
    }

    function mostrarMensaje(mensaje, esError = false) {
        const toast = document.createElement('div');
        toast.style.cssText = `
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: ${esError ? '#c97a7a' : '#4a7c59'}; color: white;
            padding: 10px 24px; border-radius: 40px; font-size: 0.8rem;
            z-index: 1000; animation: slideUp 0.3s ease;
        `;
        toast.innerHTML = `<i class="fas ${esError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${mensaje}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    function renderizarListaEstudiantes() {
        if (estudiantesTemp.length === 0) {
            listaEstudiantes.innerHTML = '<div style="color:#aabbc8; padding:12px 0;">Sin estudiantes</div>';
            return;
        }
        let html = '';
        estudiantesTemp.forEach((est, index) => {
            html += `<div class="list-item">
                        <div><strong>${escapeHtml(est.nombre)}</strong> ${est.grado ? `<span style="color:#8aa0b0; margin-left:8px;">📚 ${escapeHtml(est.grado)}</span>` : ''}</div>
                        <div style="display:flex; gap:12px;">
                            <i class="fas fa-edit edit-estudiante" data-index="${index}" style="color:#8aa0b0; cursor:pointer;"></i>
                            <i class="fas fa-trash delete-estudiante" data-index="${index}" style="color:#c97a7a; cursor:pointer;"></i>
                        </div>
                    </div>`;
        });
        listaEstudiantes.innerHTML = html;
        
        document.querySelectorAll('.edit-estudiante').forEach(icon => {
            icon.onclick = () => {
                const idx = parseInt(icon.dataset.index);
                const nuevoNombre = prompt("Nombre:", estudiantesTemp[idx].nombre);
                if (nuevoNombre?.trim()) {
                    estudiantesTemp[idx].nombre = nuevoNombre.trim();
                    estudiantesTemp[idx].grado = prompt("Grado:", estudiantesTemp[idx].grado || "") || "";
                    renderizarListaEstudiantes();
                }
            };
        });
        document.querySelectorAll('.delete-estudiante').forEach(icon => {
            icon.onclick = () => {
                if (confirm("¿Eliminar?")) {
                    estudiantesTemp.splice(parseInt(icon.dataset.index), 1);
                    renderizarListaEstudiantes();
                }
            };
        });
    }

    function renderizarListaVehiculos() {
        if (vehiculosTemp.length === 0) {
            listaVehiculos.innerHTML = '<div style="color:#aabbc8; padding:12px 0;">Sin vehículos</div>';
            return;
        }
        let html = '';
        vehiculosTemp.forEach((veh, index) => {
            html += `<div class="list-item">
                        <div><strong>${escapeHtml(veh.placa)}</strong> ${veh.color ? `<span style="color:#8aa0b0; margin-left:8px;">🎨 ${escapeHtml(veh.color)}</span>` : ''}</div>
                        <div style="display:flex; gap:12px;">
                            <i class="fas fa-edit edit-vehiculo" data-index="${index}" style="color:#8aa0b0; cursor:pointer;"></i>
                            <i class="fas fa-trash delete-vehiculo" data-index="${index}" style="color:#c97a7a; cursor:pointer;"></i>
                        </div>
                    </div>`;
        });
        listaVehiculos.innerHTML = html;
        
        document.querySelectorAll('.edit-vehiculo').forEach(icon => {
            icon.onclick = () => {
                const idx = parseInt(icon.dataset.index);
                const nuevaPlaca = prompt("Placa:", vehiculosTemp[idx].placa);
                if (nuevaPlaca?.trim()) {
                    const nuevaPlacaForm = formatearPlaca(nuevaPlaca.trim());
                    if (vehiculosTemp.some((v, i) => i !== idx && v.placa === nuevaPlacaForm)) {
                        mostrarMensaje("Placa duplicada", true);
                        return;
                    }
                    vehiculosTemp[idx].placa = nuevaPlacaForm;
                    vehiculosTemp[idx].color = prompt("Color:", vehiculosTemp[idx].color || "") || "";
                    renderizarListaVehiculos();
                }
            };
        });
        document.querySelectorAll('.delete-vehiculo').forEach(icon => {
            icon.onclick = () => {
                if (confirm("¿Eliminar?")) {
                    vehiculosTemp.splice(parseInt(icon.dataset.index), 1);
                    renderizarListaVehiculos();
                }
            };
        });
    }

    function agregarEstudiante() {
        const nombreEst = prompt("Nombre del estudiante:");
        if (nombreEst?.trim()) {
            estudiantesTemp.push({ 
                nombre: nombreEst.trim(), 
                grado: prompt("Grado:") || "" 
            });
            renderizarListaEstudiantes();
        }
    }

    function agregarVehiculo() {
        const placa = prompt("Placa del vehículo:");
        if (placa?.trim()) {
            const placaForm = formatearPlaca(placa.trim());
            if (vehiculosTemp.some(v => v.placa === placaForm)) {
                mostrarMensaje("Placa duplicada", true);
                return;
            }
            vehiculosTemp.push({ 
                placa: placaForm, 
                color: prompt("Color:") || "" 
            });
            renderizarListaVehiculos();
        }
    }

    agregarEstudianteBtn.onclick = agregarEstudiante;
    agregarVehiculoBtn.onclick = agregarVehiculo;

    function limpiarFormulario() {
        editId.value = "";
        nombre.value = "";
        telefono.value = "";
        identificacion.value = "";
        correo.value = "";
        estudiantesTemp = [];
        vehiculosTemp = [];
        renderizarListaEstudiantes();
        renderizarListaVehiculos();
    }

    function guardarOwner() {
        const nombreValue = nombre.value.trim();
        if (!nombreValue) { mostrarMensaje("Nombre obligatorio", true); return; }
        if (vehiculosTemp.length === 0) { mostrarMensaje("Agregue un vehículo", true); return; }
        
        const idActual = editId.value;
        const nuevoOwner = {
            id: idActual || Date.now().toString(),
            nombre: nombreValue,
            telefono: telefono.value.trim() || "",
            identificacion: identificacion.value.trim() || "",
            correo: correo.value.trim() || "",
            estudiantes: estudiantesTemp,
            vehiculos: vehiculosTemp,
            actualizado: new Date().toISOString()
        };
        
        if (idActual) {
            const index = owners.findIndex(o => o.id === idActual);
            if (index !== -1) {
                owners[index] = nuevoOwner;
                mostrarMensaje("Actualizado");
            }
        } else {
            owners.push(nuevoOwner);
            mostrarMensaje("Guardado");
        }
        
        guardarBackupLocal();
        limpiarFormulario();
        actualizarEstadisticas();
        aplicarBusqueda();
    }

    function eliminarOwner(id, nombreOwner) {
        if (confirm(`¿Eliminar a "${nombreOwner}"?`)) {
            owners = owners.filter(o => o.id !== id);
            guardarBackupLocal();
            actualizarEstadisticas();
            aplicarBusqueda();
            mostrarMensaje("Eliminado");
        }
    }

    function editarOwner(owner) {
        editId.value = owner.id;
        nombre.value = owner.nombre || "";
        telefono.value = owner.telefono || "";
        identificacion.value = owner.identificacion || "";
        correo.value = owner.correo || "";
        estudiantesTemp = owner.estudiantes ? [...owner.estudiantes] : [];
        vehiculosTemp = owner.vehiculos ? [...owner.vehiculos] : [];
        renderizarListaEstudiantes();
        renderizarListaVehiculos();
        document.querySelector('.tab-btn[data-tab="registrar"]').click();
    }

    function aplicarBusqueda() {
        const termino = buscarInput.value.trim().toLowerCase();
        let filtrados = [...owners];
        if (termino) {
            filtrados = owners.filter(owner => 
                owner.nombre?.toLowerCase().includes(termino) ||
                owner.telefono?.toLowerCase().includes(termino) ||
                owner.vehiculos?.some(v => v.placa?.toLowerCase().includes(termino)) ||
                owner.estudiantes?.some(e => e.nombre?.toLowerCase().includes(termino))
            );
        }
        renderizarResultados(filtrados, termino);
    }

    function renderizarResultados(filtrados, termino) {
        if (filtrados.length === 0) {
            listaContainer.innerHTML = `<div class="empty-result"><i class="fas fa-search"></i><div>Sin resultados</div></div>`;
            return;
        }
        
        let html = "";
        filtrados.forEach(owner => {
            const inicial = (owner.nombre?.[0] || "?").toUpperCase();
            html += `
            <div class="result-item">
                <div class="result-header">
                    <div class="owner-info">
                        <div class="owner-avatar">${inicial}</div>
                        <div>
                            <div class="owner-name">${resaltarTexto(owner.nombre, termino)}</div>
                            ${owner.identificacion ? `<div class="owner-id">${escapeHtml(owner.identificacion)}</div>` : ''}
                        </div>
                    </div>
                    <div class="stats-badges">
                        <span class="stat-badge"><i class="fas fa-car"></i> ${owner.vehiculos?.length || 0}</span>
                        <span class="stat-badge"><i class="fas fa-child"></i> ${owner.estudiantes?.length || 0}</span>
                    </div>
                </div>
                
                ${(owner.telefono || owner.correo) ? `
                <div class="info-grid">
                    ${owner.telefono ? `<div class="info-item"><div class="info-label">📞 TELÉFONO</div><div class="info-value">${resaltarTexto(owner.telefono, termino)}</div></div>` : ''}
                    ${owner.correo ? `<div class="info-item"><div class="info-label">✉️ CORREO</div><div class="info-value">${escapeHtml(owner.correo)}</div></div>` : ''}
                </div>
                ` : ''}
                
                <div class="sections-grid">
                    ${owner.estudiantes?.length > 0 ? `
                    <div class="section-block">
                        <div class="section-title"><i class="fas fa-child"></i> ESTUDIANTES</div>
                        <div class="items-list">
                            ${owner.estudiantes.map(est => `
                                <div class="item-line">
                                    <strong>${resaltarTexto(est.nombre, termino)}</strong>
                                    ${est.grado ? `<span class="item-color">📚 ${escapeHtml(est.grado)}</span>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                    
                    ${owner.vehiculos?.length > 0 ? `
                    <div class="section-block">
                        <div class="section-title"><i class="fas fa-car"></i> VEHÍCULOS</div>
                        <div class="items-list">
                            ${owner.vehiculos.map(veh => `
                                <div class="item-line">
                                    <span class="item-placa">${resaltarTexto(veh.placa, termino)}</span>
                                    ${veh.color ? `<span class="item-color">🎨 ${escapeHtml(veh.color)}</span>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                </div>
                
                <div class="result-actions">
                    <button class="action-button edit" onclick="window.editarOwnerDesdeGlobal('${owner.id}', ${JSON.stringify(owner).replace(/"/g, '&quot;')})">
                        <i class="fas fa-edit"></i> Editar
                    </button>
                    <button class="action-button delete" onclick="window.eliminarOwnerDesdeGlobal('${owner.id}', '${escapeHtml(owner.nombre)}')">
                        <i class="fas fa-trash"></i> Eliminar
                    </button>
                </div>
            </div>`;
        });
        listaContainer.innerHTML = html;
    }

    window.editarOwnerDesdeGlobal = function(id, owner) {
        editarOwner(owner);
    };
    
    window.eliminarOwnerDesdeGlobal = function(id, nombre) {
        eliminarOwner(id, nombre);
    };

    function resaltarTexto(texto, busqueda) {
        if (!busqueda || !texto) return escapeHtml(texto);
        const regex = new RegExp(`(${busqueda.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return escapeHtml(texto).replace(regex, '<span class="highlight">$1</span>');
    }

    function actualizarEstadisticas() {
        const totalOwners = owners.length;
        const totalVehiculos = owners.reduce((acc, o) => acc + (o.vehiculos?.length || 0), 0);
        globalStatsSpan.innerHTML = `<i class="fas fa-users"></i> ${totalOwners} · 🚗 ${totalVehiculos}`;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    // Pestañas
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabPanels = document.querySelectorAll('.tab-panel');
    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const tabId = btn.dataset.tab;
            tabBtns.forEach(b => b.classList.remove('active'));
            tabPanels.forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        });
    });

    // Eventos
    guardarBtn.onclick = guardarOwner;
    cancelarBtn.onclick = limpiarFormulario;
    buscarInput.oninput = () => aplicarBusqueda();
    refreshBtn.onclick = () => cargarDesdeSheets();

    // Inicializar
    cargarDesdeSheets();
    cargarBackupLocal();
</script>
</body>
</html>
