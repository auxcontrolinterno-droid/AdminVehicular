<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AdminVehicular - Gestión de Placas y Propietarios</title>
    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #e9f0fc 0%, #d9e4f0 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: #0b2b44;
            color: white;
            border-radius: 28px;
            padding: 20px 30px;
            margin-bottom: 28px;
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            background: #ffb347;
            padding: 12px;
            border-radius: 50%;
            color: #0b2b44;
        }

        .stats {
            background: #1f4e6e;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Tarjetas de dueños y formularios */
        .two-columns {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            margin-bottom: 40px;
        }

        .form-panel {
            flex: 1.2;
            min-width: 320px;
            background: white;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.08);
            transition: all 0.2s;
        }

        .list-panel {
            flex: 2.2;
            min-width: 420px;
            background: white;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.08);
        }

        .form-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #0b2b44;
            border-left: 8px solid #ffb347;
            padding-left: 16px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: #1e3a4d;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 18px;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
            transition: 0.2s;
            background-color: #fefefe;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #ffb347;
            box-shadow: 0 0 0 3px rgba(255,180,71,0.2);
        }

        button {
            background: #ffb347;
            border: none;
            padding: 12px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            color: #0b2b44;
            margin-right: 10px;
            margin-top: 8px;
        }

        button i {
            margin-right: 8px;
        }

        button:hover {
            background: #ff9f1a;
            transform: scale(0.97);
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .btn-secondary {
            background: #475569;
            color: white;
        }
        .btn-secondary:hover {
            background: #334155;
        }

        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 2;
            margin-bottom: 0;
        }
        .search-bar button {
            margin: 0;
        }

        /* Tabla de dueños/vehículos */
        .owner-card {
            background: #f8fafc;
            border-radius: 24px;
            margin-bottom: 24px;
            padding: 16px;
            border-left: 6px solid #ffb347;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .owner-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #cbd5e1;
        }
        .owner-name {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0f3b2c;
        }
        .owner-details {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 0.9rem;
            color: #2c3e50;
            margin-bottom: 14px;
        }
        .vehicle-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 8px;
        }
        .vehicle-table th, .vehicle-table td {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid #e2e8f0;
        }
        .vehicle-table th {
            background: #eef2ff;
            color: #1e293b;
        }
        .actions-cell i {
            margin: 0 5px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.1s;
        }
        .edit-placa {
            color: #ffb347;
        }
        .delete-placa {
            color: #dc2626;
        }
        .edit-placa:hover, .delete-placa:hover {
            opacity: 0.7;
            transform: scale(1.05);
        }
        .add-placa-btn {
            background: #e6f0fa;
            border: 1px dashed #ffb347;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #0b2b44;
        }
        .no-vehicles {
            padding: 12px;
            text-align: center;
            color: #6c757d;
            font-style: italic;
        }
        .empty-message {
            text-align: center;
            padding: 40px;
            color: #4a5568;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            color: #4b5563;
        }
        @media (max-width: 780px) {
            .owner-header { flex-direction: column; gap: 8px; }
            .vehicle-table th, .vehicle-table td { font-size: 0.8rem; padding: 8px 4px; }
        }
        .highlight {
            background-color: #fff3e0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-car-side"></i> AdminPlacas · Gestión Vehicular</h1>
        <div class="stats" id="globalStats">Cargando...</div>
    </div>

    <div class="two-columns">
        <!-- Panel izquierdo: registro / edición de dueño y agregar placa rápida -->
        <div class="form-panel">
            <div class="form-title" id="formTitle"><i class="fas fa-user-plus"></i> Registrar / Editar Dueño</div>
            <form id="ownerForm">
                <input type="hidden" id="ownerIdEdit" value="">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Nombre completo</label>
                    <input type="text" id="ownerName" placeholder="Ej: María González" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone-alt"></i> Teléfono</label>
                    <input type="tel" id="ownerPhone" placeholder="+56 9 1234 5678" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-id-card"></i> Identificación (Cédula / DNI)</label>
                    <input type="text" id="ownerIdNumber" placeholder="Documento único" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Correo (opcional)</label>
                    <input type="email" id="ownerEmail" placeholder="correo@ejemplo.com">
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px;">
                    <button type="submit" id="saveOwnerBtn"><i class="fas fa-save"></i> Guardar Dueño</button>
                    <button type="button" id="cancelEditBtn" class="btn-secondary"><i class="fas fa-times"></i> Cancelar</button>
                </div>
            </form>
            <hr style="margin: 25px 0 10px;">
            <div class="form-title" style="font-size:1.2rem;"><i class="fas fa-plus-circle"></i> Agregar placa a dueño existente</div>
            <div class="form-group">
                <label>Seleccionar dueño</label>
                <select id="quickOwnerSelect"></select>
            </div>
            <div class="form-group">
                <label>Placa del vehículo</label>
                <input type="text" id="quickPlate" placeholder="Ej: ABC-123" maxlength="10">
            </div>
            <div class="form-group">
                <label>Marca / Modelo (opcional)</label>
                <input type="text" id="quickModel" placeholder="Toyota Corolla">
            </div>
            <button id="addPlateBtn"><i class="fas fa-plus"></i> Asignar placa</button>
        </div>

        <!-- Panel derecho: lista de dueños y sus placas -->
        <div class="list-panel">
            <div class="form-title"><i class="fas fa-search"></i> Buscar</div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar por nombre, placa o teléfono...">
                <button id="clearSearchBtn"><i class="fas fa-eraser"></i> Limpiar</button>
            </div>
            <div id="ownersListContainer" style="max-height: 65vh; overflow-y: auto; padding-right: 6px;">
                <!-- Aquí se cargarán dinámicamente los dueños y sus vehículos -->
                <div class="empty-message"><i class="fas fa-spinner fa-pulse"></i> Cargando información...</div>
            </div>
        </div>
    </div>
    <footer>
        <i class="fas fa-database"></i> Datos almacenados localmente · Relación 1:N dueño ⇢ vehículos
    </footer>
</div>

<script>
    // ---------- MODELO DE DATOS ----------
    // owners: array de objetos { id, name, phone, idNumber, email, vehicles: [ { plate, model } ] }
    let owners = [];

    // Cargar datos desde localStorage
    function loadData() {
        const stored = localStorage.getItem("vehicular_admin_data");
        if(stored) {
            owners = JSON.parse(stored);
        } else {
            // Datos de ejemplo
            owners = [
                { id: "owner1", name: "Ana Rodríguez", phone: "+34 611 223 344", idNumber: "45678901L", email: "ana@mail.com", vehicles: [{ plate: "1234-JKL", model: "Seat Ibiza" }, { plate: "5678-MNP", model: "Renault Megane" }] },
                { id: "owner2", name: "Carlos Méndez", phone: "+52 55 1234 5678", idNumber: "MEX123456", email: "carlos@mail.com", vehicles: [{ plate: "ABC-1234", model: "Chevrolet Onix" }] },
                { id: "owner3", name: "Lucía Fernández", phone: "+57 300 987 6543", idNumber: "CC 98765432", email: "lucia@mail.com", vehicles: [{ plate: "XYZ-789", model: "Mazda 3" }, { plate: "PLACA-999", model: "Kia Sportage" }] }
            ];
            saveData();
        }
        updateGlobalStats();
        refreshOwnerSelect();
        renderOwnersList();
    }

    function saveData() {
        localStorage.setItem("vehicular_admin_data", JSON.stringify(owners));
        updateGlobalStats();
    }

    function updateGlobalStats() {
        const totalOwners = owners.length;
        const totalVehicles = owners.reduce((acc, owner) => acc + owner.vehicles.length, 0);
        document.getElementById("globalStats").innerHTML = `<i class="fas fa-users"></i> Dueños: ${totalOwners} &nbsp;|&nbsp; <i class="fas fa-car"></i> Vehículos: ${totalVehicles}`;
    }

    // Funciones auxiliares para dueños
    function generateId() {
        return Date.now() + '-' + Math.random().toString(36).substr(2, 6);
    }

    // Refrescar select de dueños para asignar placa rápida
    function refreshOwnerSelect() {
        const select = document.getElementById("quickOwnerSelect");
        if(!select) return;
        select.innerHTML = '<option value="">-- Seleccione dueño --</option>';
        owners.forEach(owner => {
            const option = document.createElement("option");
            option.value = owner.id;
            option.textContent = `${owner.name} (${owner.idNumber})`;
            select.appendChild(option);
        });
    }

    // Renderizar lista completa de dueños y sus vehículos, con búsqueda integrada
    function renderOwnersList(filterText = "") {
        const container = document.getElementById("ownersListContainer");
        if(!container) return;
        let filteredOwners = [...owners];
        if(filterText.trim() !== "") {
            const lowerFilter = filterText.toLowerCase();
            filteredOwners = owners.filter(owner => {
                // Buscar por nombre, teléfono, cédula, o en las placas/modelos
                const matchOwner = owner.name.toLowerCase().includes(lowerFilter) ||
                                   owner.phone.toLowerCase().includes(lowerFilter) ||
                                   owner.idNumber.toLowerCase().includes(lowerFilter) ||
                                   (owner.email && owner.email.toLowerCase().includes(lowerFilter));
                if(matchOwner) return true;
                // buscar en sus vehículos
                return owner.vehicles.some(veh => 
                    veh.plate.toLowerCase().includes(lowerFilter) || 
                    (veh.model && veh.model.toLowerCase().includes(lowerFilter))
                );
            });
        }
        if(filteredOwners.length === 0) {
            container.innerHTML = `<div class="empty-message"><i class="fas fa-search"></i> No se encontraron dueños o placas.</div>`;
            return;
        }
        let html = "";
        filteredOwners.forEach(owner => {
            // Resaltar coincidencias en nombre si hay búsqueda (simple)
            const highlightName = (filterText && owner.name.toLowerCase().includes(filterText.toLowerCase())) ? `<span class="highlight">${escapeHtml(owner.name)}</span>` : escapeHtml(owner.name);
            html += `<div class="owner-card" data-owner-id="${owner.id}">
                        <div class="owner-header">
                            <div class="owner-name">${highlightName}</div>
                            <div style="display: flex; gap: 10px;">
                                <button class="edit-owner-btn btn-secondary" data-id="${owner.id}" style="padding: 6px 12px; font-size:0.8rem;"><i class="fas fa-edit"></i> Editar dueño</button>
                                <button class="delete-owner-btn btn-danger" data-id="${owner.id}" style="padding: 6px 12px; font-size:0.8rem;"><i class="fas fa-trash-alt"></i> Eliminar</button>
                            </div>
                        </div>
                        <div class="owner-details">
                            <span><i class="fas fa-id-card"></i> ${escapeHtml(owner.idNumber)}</span>
                            <span><i class="fas fa-phone"></i> ${escapeHtml(owner.phone)}</span>
                            ${owner.email ? `<span><i class="fas fa-envelope"></i> ${escapeHtml(owner.email)}</span>` : ''}
                        </div>
                        <div style="margin-top: 8px; font-weight: 600;"><i class="fas fa-list"></i> Vehículos registrados:</div>
                        <table class="vehicle-table">
                            <thead>
                                <tr><th>Placa</th><th>Marca/Modelo</th><th style="width:80px;">Acciones</th></tr>
                            </thead>
                            <tbody>`;
            if(owner.vehicles.length === 0) {
                html += `<tr><td colspan="3" class="no-vehicles">Sin vehículos asociados. <i class="fas fa-plus-circle add-placa-icon" style="cursor:pointer;" data-owner="${owner.id}"> Agregar placa</i></td></tr>`;
            } else {
                owner.vehicles.forEach((vehicle, idx) => {
                    const plateHighlight = (filterText && vehicle.plate.toLowerCase().includes(filterText.toLowerCase())) ? `<span class="highlight">${escapeHtml(vehicle.plate)}</span>` : escapeHtml(vehicle.plate);
                    const modelHighlight = (filterText && vehicle.model && vehicle.model.toLowerCase().includes(filterText.toLowerCase())) ? `<span class="highlight">${escapeHtml(vehicle.model)}</span>` : escapeHtml(vehicle.model || '—');
                    html += `<tr data-plate-index="${idx}" data-owner-id="${owner.id}">
                                <td>${plateHighlight}</td>
                                <td>${modelHighlight}</td>
                                <td class="actions-cell">
                                    <i class="fas fa-pen edit-placa" data-owner="${owner.id}" data-plate="${escapeAttr(vehicle.plate)}" data-model="${escapeAttr(vehicle.model || '')}" title="Editar placa"></i>
                                    <i class="fas fa-trash delete-placa" data-owner="${owner.id}" data-plate="${escapeAttr(vehicle.plate)}" title="Eliminar placa"></i>
                                </td>
                            </tr>`;
                });
            }
            html += `</tbody></table>
                    <div class="add-placa-btn" data-owner-id="${owner.id}"><i class="fas fa-plus-circle"></i> Agregar otro vehículo a este dueño</div>
                    </div>`;
        });
        container.innerHTML = html;

        // Eventos dinámicos después de renderizar
        attachOwnerActions();
        attachVehicleActions();
        attachAddVehicleFromCard();
    }

    function attachOwnerActions() {
        document.querySelectorAll('.edit-owner-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const ownerId = btn.getAttribute('data-id');
                const owner = owners.find(o => o.id === ownerId);
                if(owner) {
                    document.getElementById("ownerIdEdit").value = owner.id;
                    document.getElementById("ownerName").value = owner.name;
                    document.getElementById("ownerPhone").value = owner.phone;
                    document.getElementById("ownerIdNumber").value = owner.idNumber;
                    document.getElementById("ownerEmail").value = owner.email || "";
                    document.getElementById("formTitle").innerHTML = '<i class="fas fa-user-edit"></i> Editando Dueño';
                }
            });
        });
        document.querySelectorAll('.delete-owner-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const ownerId = btn.getAttribute('data-id');
                if(confirm("¿Eliminar este dueño y todos sus vehículos asociados? Esta acción es irreversible.")) {
                    owners = owners.filter(o => o.id !== ownerId);
                    saveData();
                    renderOwnersList(document.getElementById("searchInput").value);
                    refreshOwnerSelect();
                    clearOwnerForm();
                }
            });
        });
    }

    function attachVehicleActions() {
        // Editar placa (abre un prompt con datos actuales)
        document.querySelectorAll('.edit-placa').forEach(icon => {
            icon.addEventListener('click', (e) => {
                const ownerId = icon.getAttribute('data-owner');
                const oldPlate = icon.getAttribute('data-plate');
                const oldModel = icon.getAttribute('data-model');
                const newPlate = prompt("Editar placa:", oldPlate);
                if(newPlate && newPlate.trim() !== "") {
                    const newModel = prompt("Editar modelo / marca:", oldModel);
                    const owner = owners.find(o => o.id === ownerId);
                    if(owner) {
                        const vehicleIndex = owner.vehicles.findIndex(v => v.plate === oldPlate);
                        if(vehicleIndex !== -1) {
                            // Verificar si nueva placa ya existe en otro vehículo del mismo dueño (evitar duplicado)
                            const duplicate = owner.vehicles.some((v, idx) => idx !== vehicleIndex && v.plate === newPlate.trim());
                            if(duplicate) {
                                alert("Ya existe un vehículo con esa placa para este dueño.");
                                return;
                            }
                            owner.vehicles[vehicleIndex].plate = newPlate.trim();
                            if(newModel !== null) owner.vehicles[vehicleIndex].model = newModel.trim() || "";
                            saveData();
                            renderOwnersList(document.getElementById("searchInput").value);
                            refreshOwnerSelect();
                        } else {
                            alert("No se encontró el vehículo.");
                        }
                    }
                }
            });
        });
        // Eliminar placa
        document.querySelectorAll('.delete-placa').forEach(icon => {
            icon.addEventListener('click', (e) => {
                const ownerId = icon.getAttribute('data-owner');
                const plateToDelete = icon.getAttribute('data-plate');
                if(confirm(`¿Eliminar la placa ${plateToDelete}?`)) {
                    const owner = owners.find(o => o.id === ownerId);
                    if(owner) {
                        owner.vehicles = owner.vehicles.filter(v => v.plate !== plateToDelete);
                        saveData();
                        renderOwnersList(document.getElementById("searchInput").value);
                        refreshOwnerSelect();
                    }
                }
            });
        });
    }

    function attachAddVehicleFromCard() {
        document.querySelectorAll('.add-placa-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const ownerId = btn.getAttribute('data-owner-id');
                const owner = owners.find(o => o.id === ownerId);
                if(owner) {
                    const newPlate = prompt("Ingrese la nueva placa (ej: AB-123CD):");
                    if(newPlate && newPlate.trim()) {
                        // validar placa duplicada dentro del mismo dueño
                        if(owner.vehicles.some(v => v.plate === newPlate.trim())) {
                            alert("Este dueño ya tiene un vehículo con esa placa.");
                            return;
                        }
                        const newModel = prompt("Marca / Modelo (opcional):");
                        owner.vehicles.push({ plate: newPlate.trim(), model: newModel ? newModel.trim() : "" });
                        saveData();
                        renderOwnersList(document.getElementById("searchInput").value);
                        refreshOwnerSelect();
                    }
                }
            });
        });
    }

    // Guardar dueño (nuevo o edición)
    function saveOwnerFromForm(event) {
        event.preventDefault();
        const editId = document.getElementById("ownerIdEdit").value;
        const name = document.getElementById("ownerName").value.trim();
        const phone = document.getElementById("ownerPhone").value.trim();
        const idNumber = document.getElementById("ownerIdNumber").value.trim();
        const email = document.getElementById("ownerEmail").value.trim();

        if(!name || !phone || !idNumber) {
            alert("Nombre, teléfono e identificación son obligatorios.");
            return;
        }
        if(editId === "") {
            // Nuevo dueño
            const newId = generateId();
            const newOwner = {
                id: newId,
                name: name,
                phone: phone,
                idNumber: idNumber,
                email: email || "",
                vehicles: []
            };
            owners.push(newOwner);
        } else {
            // Actualizar existente
            const index = owners.findIndex(o => o.id === editId);
            if(index !== -1) {
                owners[index].name = name;
                owners[index].phone = phone;
                owners[index].idNumber = idNumber;
                owners[index].email = email || "";
            } else {
                alert("Dueño no encontrado");
            }
        }
        saveData();
        renderOwnersList(document.getElementById("searchInput").value);
        refreshOwnerSelect();
        clearOwnerForm();
    }

    function clearOwnerForm() {
        document.getElementById("ownerIdEdit").value = "";
        document.getElementById("ownerName").value = "";
        document.getElementById("ownerPhone").value = "";
        document.getElementById("ownerIdNumber").value = "";
        document.getElementById("ownerEmail").value = "";
        document.getElementById("formTitle").innerHTML = '<i class="fas fa-user-plus"></i> Registrar / Editar Dueño';
    }

    // Agregar placa a dueño existente (desde panel rápido)
    function addPlateToOwner() {
        const ownerId = document.getElementById("quickOwnerSelect").value;
        const plate = document.getElementById("quickPlate").value.trim();
        const model = document.getElementById("quickModel").value.trim();
        if(!ownerId) {
            alert("Debe seleccionar un dueño.");
            return;
        }
        if(!plate) {
            alert("Debe ingresar una placa.");
            return;
        }
        const owner = owners.find(o => o.id === ownerId);
        if(owner) {
            if(owner.vehicles.some(v => v.plate === plate)) {
                alert(`El dueño ${owner.name} ya tiene registrada la placa ${plate}.`);
                return;
            }
            owner.vehicles.push({ plate: plate, model: model });
            saveData();
            renderOwnersList(document.getElementById("searchInput").value);
            refreshOwnerSelect();
            document.getElementById("quickPlate").value = "";
            document.getElementById("quickModel").value = "";
        } else {
            alert("Dueño no válido");
        }
    }

    // Buscar y limpiar
    function setupSearch() {
        const searchInput = document.getElementById("searchInput");
        const clearBtn = document.getElementById("clearSearchBtn");
        const updateSearch = () => renderOwnersList(searchInput.value);
        searchInput.addEventListener("input", updateSearch);
        clearBtn.addEventListener("click", () => {
            searchInput.value = "";
            renderOwnersList("");
        });
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    function escapeAttr(str) {
        if(!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Inicialización
    document.addEventListener("DOMContentLoaded", () => {
        loadData();
        document.getElementById("ownerForm").addEventListener("submit", saveOwnerFromForm);
        document.getElementById("cancelEditBtn").addEventListener("click", clearOwnerForm);
        document.getElementById("addPlateBtn").addEventListener("click", addPlateToOwner);
        setupSearch();
    });
</script>
