<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminVehiculos - Sistema Seguro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header {
            background: rgba(255,255,255,0.95);
            border-radius: 28px;
            padding: 20px 30px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 12px 20px rgba(0,0,0,0.15);
        }
        
        .header h1 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1e3c72;
        }
        
        .stats {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 8px 18px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
        }
        
        .auth-status {
            background: #e8f5e9;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #2e7d32;
        }
        
        .auth-status.error {
            background: #ffebee;
            color: #c62828;
        }
        
        .two-columns { display: flex; flex-wrap: wrap; gap: 28px; margin-bottom: 40px; }
        .form-panel, .list-panel {
            background: white;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }
        .form-panel { flex: 1.2; min-width: 300px; max-height: 85vh; overflow-y: auto; }
        .list-panel { flex: 2.2; min-width: 400px; }
        
        .form-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #1e3c72;
            border-left: 6px solid #2a5298;
            padding-left: 15px;
        }
        
        .form-group { margin-bottom: 15px; }
        label { font-weight: 600; display: block; margin-bottom: 5px; color: #555; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            font-size: 0.95rem;
        }
        input:focus, select:focus { outline: none; border-color: #2a5298; }
        
        button {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            margin-right: 8px;
            margin-top: 5px;
        }
        button i { margin-right: 6px; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-bar input { flex: 2; margin-bottom: 0; }
        
        .owner-card {
            background: #f8f9fa;
            border-radius: 18px;
            margin-bottom: 20px;
            padding: 18px;
            border-left: 5px solid #2a5298;
        }
        
        .owner-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .owner-name { font-size: 1.3rem; font-weight: 800; color: #1e3c72; }
        .owner-details { display: flex; gap: 15px; flex-wrap: wrap; font-size: 0.85rem; color: #666; margin-bottom: 12px; }
        
        .students-section {
            background: #fff5e6;
            border-radius: 14px;
            padding: 10px;
            margin: 10px 0;
        }
        
        .student-item {
            background: white;
            padding: 6px 10px;
            margin: 6px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .vehicle-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 8px;
            font-size: 0.85rem;
        }
        
        .vehicle-table th, .vehicle-table td { padding: 8px 6px; border-bottom: 1px solid #e0e0e0; text-align: left; }
        .actions-cell i { margin: 0 3px; cursor: pointer; }
        .edit-placa { color: #2a5298; }
        .delete-placa, .delete-student { color: #e74c3c; cursor: pointer; }
        
        .add-placa-btn, .add-student-btn {
            background: #f0f0f0;
            border: 2px dashed #2a5298;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #2a5298;
            margin-right: 8px;
        }
        
        .add-student-btn { border-color: #ff9800; color: #ff9800; }
        .empty-message { text-align: center; padding: 40px; color: #999; }
        .highlight { background-color: #fff3cd; padding: 2px 5px; border-radius: 5px; }
        
        #loadingToast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e3c72;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            display: none;
            z-index: 1000;
        }
        
        footer { text-align: center; margin-top: 30px; color: white; opacity: 0.8; }
        
        .security-badge {
            background: #e8f5e9;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        @media (max-width: 768px) { .form-panel, .list-panel { min-width: 100%; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-shield-alt"></i> AdminVehiculos · Sistema Seguro</h1>
        <div class="stats" id="globalStats">Cargando...</div>
    </div>
    
    <div class="security-badge" id="authStatus">
        <i class="fas fa-lock"></i> <span id="authStatusText">Verificando autenticación...</span>
    </div>

    <div class="two-columns">
        <div class="form-panel">
            <div class="form-title"><i class="fas fa-user-plus"></i> Registrar Dueño</div>
            <input type="hidden" id="ownerIdEdit">
            <div class="form-group">
                <label>Nombre completo *</label>
                <input type="text" id="ownerName" placeholder="Nombre del padre/tutor">
            </div>
            <div class="form-group">
                <label>Teléfono *</label>
                <input type="text" id="ownerPhone" placeholder="Teléfono">
            </div>
            <div class="form-group">
                <label>Identificación *</label>
                <input type="text" id="ownerIdNumber" placeholder="Cédula/DNI (único)">
            </div>
            <div class="form-group">
                <label>Correo</label>
                <input type="email" id="ownerEmail" placeholder="correo@ejemplo.com">
            </div>
            
            <div class="form-title" style="font-size:1.1rem; margin-top:15px;"><i class="fas fa-child"></i> Estudiante (opcional)</div>
            <div class="form-group">
                <input type="text" id="studentName" placeholder="Nombre del estudiante">
            </div>
            <div class="form-group">
                <input type="text" id="studentGrade" placeholder="Grado que cursa">
            </div>
            
            <button id="saveOwnerBtn"><i class="fas fa-save"></i> Guardar</button>
            <button id="cancelEditBtn"><i class="fas fa-times"></i> Cancelar</button>
            
            <hr style="margin: 20px 0;">
            <div class="form-title" style="font-size:1.1rem;"><i class="fas fa-car"></i> Agregar vehículo</div>
            <div class="form-group">
                <select id="quickOwnerSelect"></select>
            </div>
            <div class="form-group">
                <input type="text" id="quickPlate" placeholder="Placa (ej: ABC-123)">
            </div>
            <div class="form-group">
                <input type="text" id="quickModel" placeholder="Marca/Modelo">
            </div>
            <button id="addPlateBtn"><i class="fas fa-plus"></i> Asignar placa</button>
        </div>

        <div class="list-panel">
            <div class="form-title"><i class="fas fa-search"></i> Buscar</div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar por nombre, placa o estudiante...">
                <button id="clearSearchBtn"><i class="fas fa-eraser"></i> Limpiar</button>
            </div>
            <div id="ownersListContainer" style="max-height: 65vh; overflow-y: auto;">
                <div class="empty-message"><i class="fas fa-spinner fa-pulse"></i> Conectando a Firestore seguro...</div>
            </div>
        </div>
    </div>
    <footer>
        <i class="fas fa-shield-alt"></i> Datos seguros con autenticación anónima · Firestore con reglas protegidas
    </footer>
</div>
<div id="loadingToast"><i class="fas fa-circle-notch fa-spin"></i> Procesando...</div>

<script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
        }
    }
</script>

<script type="module">
    import { initializeApp } from "firebase/app";
    import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "firebase/firestore";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "firebase/auth";
    
    const firebaseConfig = {
        apiKey: "AIzaSyBPZFMfCwuVrTZVvEGNnEfe1rJohQgVOzI",
        authDomain: "admin-vehiculos-88011.firebaseapp.com",
        projectId: "admin-vehiculos-88011",
        storageBucket: "admin-vehiculos-88011.firebasestorage.app",
        messagingSenderId: "548122701117",
        appId: "1:548122701117:web:69bc9781a18bd0dedc6954",
        measurementId: "G-7XCPG0HT93"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    
    let localOwners = [];
    let currentFilter = "";
    let isAuthenticated = false;
    
    // DOM elements
    const ownersContainer = document.getElementById("ownersListContainer");
    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const globalStatsSpan = document.getElementById("globalStats");
    const quickOwnerSelect = document.getElementById("quickOwnerSelect");
    const ownerIdEdit = document.getElementById("ownerIdEdit");
    const ownerName = document.getElementById("ownerName");
    const ownerPhone = document.getElementById("ownerPhone");
    const ownerIdNumber = document.getElementById("ownerIdNumber");
    const ownerEmail = document.getElementById("ownerEmail");
    const studentName = document.getElementById("studentName");
    const studentGrade = document.getElementById("studentGrade");
    const saveOwnerBtn = document.getElementById("saveOwnerBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const addPlateBtn = document.getElementById("addPlateBtn");
    const quickPlate = document.getElementById("quickPlate");
    const quickModel = document.getElementById("quickModel");
    const loadingToast = document.getElementById("loadingToast");
    const authStatusText = document.getElementById("authStatusText");
    const authStatusDiv = document.getElementById("authStatus");
    
    function showLoading(show) {
        loadingToast.style.display = show ? "flex" : "none";
    }
    
    function updateAuthStatus(user) {
        if (user) {
            authStatusText.innerHTML = `<i class="fas fa-check-circle"></i> Autenticación activa · Conectado como: ${user.uid.substring(0, 8)}...`;
            authStatusDiv.style.background = "#e8f5e9";
            isAuthenticated = true;
        } else {
            authStatusText.innerHTML = `<i class="fas fa-exclamation-triangle"></i> No autenticado. Conectando...`;
            authStatusDiv.style.background = "#fff3cd";
            isAuthenticated = false;
        }
    }
    
    // Cargar datos en tiempo real (solo si está autenticado)
    function loadOwnersRealtime() {
        if (!isAuthenticated) return;
        
        showLoading(true);
        const q = query(collection(db, "owners"), orderBy("name"));
        onSnapshot(q, (snapshot) => {
            localOwners = [];
            snapshot.forEach(doc => {
                localOwners.push({ id: doc.id, ...doc.data() });
            });
            updateGlobalStats();
            refreshOwnerSelect();
            renderOwnersList(currentFilter);
            showLoading(false);
        }, (error) => {
            console.error("Error:", error);
            showLoading(false);
            if (error.code === 'permission-denied') {
                ownersContainer.innerHTML = `<div class="empty-message"><i class="fas fa-shield-alt"></i> Error de permisos.<br><br>
                <strong>Configura las reglas de Firestore como se indicó arriba.</strong></div>`;
            } else {
                ownersContainer.innerHTML = `<div class="empty-message"><i class="fas fa-exclamation-triangle"></i> ${error.message}</div>`;
            }
        });
    }
    
    async function saveOwner() {
        if (!isAuthenticated) {
            alert("Esperando autenticación... Intenta de nuevo en unos segundos.");
            return;
        }
        
        const id = ownerIdEdit.value;
        const name = ownerName.value.trim();
        const phone = ownerPhone.value.trim();
        const idNumber = ownerIdNumber.value.trim();
        const email = ownerEmail.value.trim();
        const newStudentName = studentName.value.trim();
        const newStudentGrade = studentGrade.value.trim();
        
        if (!name || !phone || !idNumber) {
            alert("Complete nombre, teléfono e identificación");
            return;
        }
        
        showLoading(true);
        try {
            let students = [];
            if (id) {
                const existing = localOwners.find(o => o.id === id);
                if (existing?.students) students = [...existing.students];
            }
            
            if (newStudentName) {
                students.push({
                    id: Date.now().toString(),
                    name: newStudentName,
                    grade: newStudentGrade
                });
            }
            
            const ownerData = {
                name, phone, idNumber, email,
                vehicles: id ? (localOwners.find(o => o.id === id)?.vehicles || []) : [],
                students: students,
                updatedAt: new Date().toISOString(),
                createdAt: id ? undefined : new Date().toISOString()
            };
            
            if (id) {
                await updateDoc(doc(db, "owners", id), ownerData);
            } else {
                await addDoc(collection(db, "owners"), ownerData);
            }
            
            // Limpiar formulario
            ownerIdEdit.value = "";
            ownerName.value = "";
            ownerPhone.value = "";
            ownerIdNumber.value = "";
            ownerEmail.value = "";
            studentName.value = "";
            studentGrade.value = "";
            
        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            showLoading(false);
        }
    }
    
    async function deleteOwner(ownerId) {
        if (!isAuthenticated) return;
        if (!confirm("¿Eliminar este dueño y todos sus datos? Esta acción es irreversible.")) return;
        showLoading(true);
        try {
            await deleteDoc(doc(db, "owners", ownerId));
        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            showLoading(false);
        }
    }
    
    async function addVehicle(ownerId, plate, model) {
        if (!isAuthenticated) return;
        if (!plate?.trim()) {
            alert("Ingrese una placa");
            return;
        }
        const owner = localOwners.find(o => o.id === ownerId);
        if (!owner) return;
        
        const vehicles = [...(owner.vehicles || [])];
        if (vehicles.some(v => v.plate === plate.trim())) {
            alert("Ya existe esa placa para este dueño");
            return;
        }
        
        vehicles.push({ plate: plate.trim(), model: model?.trim() || "" });
        showLoading(true);
        try {
            await updateDoc(doc(db, "owners", ownerId), { vehicles });
            quickPlate.value = "";
            quickModel.value = "";
        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            showLoading(false);
        }
    }
    
    async function deleteVehicle(ownerId, plateToDelete) {
        if (!isAuthenticated) return;
        const owner = localOwners.find(o => o.id === ownerId);
        if (!owner) return;
        const newVehicles = owner.vehicles.filter(v => v.plate !== plateToDelete);
        showLoading(true);
        try {
            await updateDoc(doc(db, "owners", ownerId), { vehicles: newVehicles });
        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            showLoading(false);
        }
    }
    
    async function addStudent(ownerId, studentNameValue, studentGradeValue) {
        if (!isAuthenticated) return;
        if (!studentNameValue?.trim()) {
            alert("Ingrese el nombre del estudiante");
            return;
        }
        const owner = localOwners.find(o => o.id === ownerId);
        if (!owner) return;
        
        const students = [...(owner.students || [])];
        students.push({
            id: Date.now().toString(),
            name: studentNameValue.trim(),
            grade: studentGradeValue?.trim() || ""
        });
        showLoading(true);
        try {
            await updateDoc(doc(db, "owners", ownerId), { students });
        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            showLoading(false);
        }
    }
    
    async function deleteStudent(ownerId, studentId) {
        if (!isAuthenticated) return;
        const owner = localOwners.find(o => o.id === ownerId);
        if (!owner) return;
        const newStudents = owner.students.filter(s => s.id !== studentId);
        showLoading(true);
        try {
            await updateDoc(doc(db, "owners", ownerId), { students: newStudents });
        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            showLoading(false);
        }
    }
    
    function renderOwnersList(filterText = "") {
        currentFilter = filterText;
        let filtered = [...localOwners];
        
        if (filterText.trim()) {
            const lowerFilter = filterText.toLowerCase();
            filtered = localOwners.filter(owner => {
                if (owner.name?.toLowerCase().includes(lowerFilter)) return true;
                if (owner.phone?.toLowerCase().includes(lowerFilter)) return true;
                if (owner.idNumber?.toLowerCase().includes(lowerFilter)) return true;
                if (owner.vehicles?.some(v => v.plate?.toLowerCase().includes(lowerFilter))) return true;
                if (owner.students?.some(s => s.name?.toLowerCase().includes(lowerFilter))) return true;
                return false;
            });
        }
        
        if (filtered.length === 0) {
            ownersContainer.innerHTML = `<div class="empty-message"><i class="fas fa-info-circle"></i> No hay registros. ¡Agrega un dueño!</div>`;
            return;
        }
        
        let html = "";
        filtered.forEach(owner => {
            html += `
            <div class="owner-card">
                <div class="owner-header">
                    <div class="owner-name">${escapeHtml(owner.name)}</div>
                    <div>
                        <button class="edit-owner-btn" data-id="${owner.id}" style="padding:5px 12px; font-size:0.8rem;"><i class="fas fa-edit"></i> Editar</button>
                        <button class="delete-owner-btn" data-id="${owner.id}" style="padding:5px 12px; font-size:0.8rem; background:#c62828;"><i class="fas fa-trash"></i> Eliminar</button>
                    </div>
                </div>
                <div class="owner-details">
                    <span><i class="fas fa-id-card"></i> ${escapeHtml(owner.idNumber)}</span>
                    <span><i class="fas fa-phone"></i> ${escapeHtml(owner.phone)}</span>
                    ${owner.email ? `<span><i class="fas fa-envelope"></i> ${escapeHtml(owner.email)}</span>` : ''}
                </div>
                
                <div class="students-section">
                    <div class="form-title" style="font-size:0.9rem; margin-bottom:8px;"><i class="fas fa-child"></i> Estudiantes</div>`;
            
            if (!owner.students?.length) {
                html += `<div style="padding:8px; color:#999; text-align:center;">No hay estudiantes registrados</div>`;
            } else {
                owner.students.forEach(student => {
                    html += `
                    <div class="student-item">
                        <div>
                            <strong>${escapeHtml(student.name)}</strong>
                            ${student.grade ? ` <span style="color:#ff9800;">📚 ${escapeHtml(student.grade)}</span>` : ''}
                        </div>
                        <i class="fas fa-trash delete-student" data-owner="${owner.id}" data-student-id="${student.id}" style="cursor:pointer; color:#c62828;"></i>
                    </div>`;
                });
            }
            
            html += `<div class="add-student-btn" data-owner-id="${owner.id}"><i class="fas fa-plus-circle"></i> Agregar estudiante</div>
                </div>
                
                <div style="margin-top:12px;"><strong><i class="fas fa-car"></i> Vehículos</strong></div>
                <table class="vehicle-table">
                    <thead><tr><th>Placa</th><th>Modelo</th><th>Acciones</th></tr></thead>
                    <tbody>`;
            
            if (!owner.vehicles?.length) {
                html += `<tr><td colspan="3" style="text-align:center; color:#999;">Sin vehículos</td></tr>`;
            } else {
                owner.vehicles.forEach(vehicle => {
                    html += `
                    <tr>
                        <td>${escapeHtml(vehicle.plate)}</td>
                        <td>${escapeHtml(vehicle.model || '—')}</td>
                        <td class="actions-cell">
                            <i class="fas fa-pen edit-placa" data-owner="${owner.id}" data-plate="${escapeAttr(vehicle.plate)}" data-model="${escapeAttr(vehicle.model || '')}"></i>
                            <i class="fas fa-trash delete-placa" data-owner="${owner.id}" data-plate="${escapeAttr(vehicle.plate)}"></i>
                        </td>
                    </tr>`;
                });
            }
            
            html += `</tbody>
                </table>
                <div class="add-placa-btn" data-owner-id="${owner.id}"><i class="fas fa-plus-circle"></i> Agregar vehículo</div>
            </div>`;
        });
        
        ownersContainer.innerHTML = html;
        
        // Eventos
        document.querySelectorAll('.edit-owner-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const owner = localOwners.find(o => o.id === btn.dataset.id);
                if (owner) {
                    ownerIdEdit.value = owner.id;
                    ownerName.value = owner.name;
                    ownerPhone.value = owner.phone;
                    ownerIdNumber.value = owner.idNumber;
                    ownerEmail.value = owner.email || "";
                    studentName.value = "";
                    studentGrade.value = "";
                }
            });
        });
        
        document.querySelectorAll('.delete-owner-btn').forEach(btn => {
            btn.addEventListener('click', () => deleteOwner(btn.dataset.id));
        });
        
        document.querySelectorAll('.edit-placa').forEach(icon => {
            icon.addEventListener('click', () => {
                const ownerId = icon.dataset.owner;
                const oldPlate = icon.dataset.plate;
                const oldModel = icon.dataset.model;
                const newPlate = prompt("Editar placa:", oldPlate);
                if (newPlate?.trim()) {
                    const newModel = prompt("Editar modelo:", oldModel);
                    addVehicle(ownerId, newPlate.trim(), newModel);
                    // Nota: Para editar realmente necesitamos eliminar la anterior y crear nueva
                    // Por simplicidad, eliminamos la anterior y creamos nueva
                    if (newPlate !== oldPlate) {
                        deleteVehicle(ownerId, oldPlate);
                    }
                }
            });
        });
        
        document.querySelectorAll('.delete-placa').forEach(icon => {
            icon.addEventListener('click', () => {
                if (confirm("¿Eliminar este vehículo?")) {
                    deleteVehicle(icon.dataset.owner, icon.dataset.plate);
                }
            });
        });
        
        document.querySelectorAll('.add-placa-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const plate = prompt("Ingrese la placa del vehículo:");
                if (plate?.trim()) {
                    const model = prompt("Ingrese el modelo (opcional):");
                    addVehicle(btn.dataset.ownerId, plate.trim(), model || "");
                }
            });
        });
        
        document.querySelectorAll('.add-student-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const studentNameInput = prompt("Nombre del estudiante:");
                if (studentNameInput?.trim()) {
                    const studentGradeInput = prompt("Grado que cursa (opcional):");
                    addStudent(btn.dataset.ownerId, studentNameInput, studentGradeInput || "");
                }
            });
        });
        
        document.querySelectorAll('.delete-student').forEach(icon => {
            icon.addEventListener('click', () => {
                if (confirm("¿Eliminar este estudiante?")) {
                    deleteStudent(icon.dataset.owner, icon.dataset.studentId);
                }
            });
        });
    }
    
    function refreshOwnerSelect() {
        quickOwnerSelect.innerHTML = '<option value="">-- Seleccionar dueño --</option>';
        localOwners.forEach(owner => {
            const option = document.createElement("option");
            option.value = owner.id;
            option.textContent = `${owner.name} (${owner.idNumber})`;
            quickOwnerSelect.appendChild(option);
        });
    }
    
    function updateGlobalStats() {
        const totalOwners = localOwners.length;
        const totalVehicles = localOwners.reduce((acc, o) => acc + (o.vehicles?.length || 0), 0);
        const totalStudents = localOwners.reduce((acc, o) => acc + (o.students?.length || 0), 0);
        globalStatsSpan.innerHTML = `<i class="fas fa-users"></i> Dueños: ${totalOwners} | <i class="fas fa-car"></i> Vehículos: ${totalVehicles} | <i class="fas fa-child"></i> Estudiantes: ${totalStudents}`;
    }
    
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
    function escapeAttr(str) { return str ? str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : ''; }
    
    // Inicializar autenticación
    function initAuth() {
        onAuthStateChanged(auth, (user) => {
            if (user) {
                updateAuthStatus(user);
                loadOwnersRealtime();
            } else {
                updateAuthStatus(null);
                signInAnonymously(auth).catch(error => {
                    console.error("Auth error:", error);
                    authStatusText.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Error de autenticación. Habilita inicio de sesión anónimo en Firebase.`;
                    authStatusDiv.style.background = "#ffebee";
                    ownersContainer.innerHTML = `<div class="empty-message"><i class="fas fa-lock"></i> Error de autenticación.<br><br>
                    <strong>Solución:</strong> Ve a Firebase Console → Authentication → Sign-in methods → Habilita "Anónimo"</div>`;
                });
            }
        });
    }
    
    // Event listeners
    saveOwnerBtn.addEventListener("click", saveOwner);
    cancelEditBtn.addEventListener("click", () => {
        ownerIdEdit.value = "";
        ownerName.value = "";
        ownerPhone.value = "";
        ownerIdNumber.value = "";
        ownerEmail.value = "";
        studentName.value = "";
        studentGrade.value = "";
    });
    addPlateBtn.addEventListener("click", () => {
        const ownerId = quickOwnerSelect.value;
        if (!ownerId) { alert("Seleccione un dueño"); return; }
        const plate = quickPlate.value.trim();
        if (!plate) { alert("Ingrese una placa"); return; }
        const model = quickModel.value.trim();
        addVehicle(ownerId, plate, model);
    });
    searchInput.addEventListener("input", (e) => renderOwnersList(e.target.value));
    clearSearchBtn.addEventListener("click", () => {
        searchInput.value = "";
        renderOwnersList("");
    });
    
    initAuth();
</script>
</body>
</html>
