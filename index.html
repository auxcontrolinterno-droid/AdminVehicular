<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <title>AutoRegistro PRO - Búsqueda Mejorada</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
            border-radius: 24px;
            padding: 20px 22px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 1.6rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            padding: 12px;
            border-radius: 16px;
            color: white;
        }

        .stats {
            background: rgba(0,180,219,0.2);
            padding: 10px 18px;
            border-radius: 30px;
            color: #00b4db;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .auth-status {
            background: rgba(0,180,219,0.15);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: #00b4db;
        }

        .auth-status.success {
            background: rgba(76,175,80,0.15);
            color: #4caf50;
        }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            color: rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(0,180,219,0.3);
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: rgba(255,255,255,0.98);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 22px;
            color: #1a1a2e;
            border-left: 5px solid #00b4db;
            padding-left: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin: 15px 0 10px 0;
            color: #00b4db;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .field-group {
            margin-bottom: 18px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            display: block;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 16px 18px;
            border: 2px solid #e8e8e8;
            border-radius: 18px;
            font-size: 1rem;
            background: #fafafa;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #00b4db;
            background: white;
            box-shadow: 0 0 0 3px rgba(0,180,219,0.1);
        }

        .plate-input {
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 1.2rem;
        }

        /* Listas dinámicas */
        .dynamic-list {
            background: #f8f9fa;
            border-radius: 18px;
            padding: 12px;
            margin: 10px 0;
        }

        .list-item {
            background: white;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #00b4db;
            transition: all 0.2s;
        }

        .list-item:hover {
            transform: translateX(3px);
        }

        .item-info {
            flex: 1;
        }

        .item-title {
            font-weight: bold;
            font-size: 1rem;
        }

        .item-subtitle {
            font-size: 0.75rem;
            color: #666;
            margin-top: 4px;
        }

        .item-actions {
            display: flex;
            gap: 10px;
        }

        .item-actions i {
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px;
            transition: all 0.2s;
        }

        .item-actions i:active {
            transform: scale(0.9);
        }

        .edit-item { color: #1976d2; }
        .delete-item { color: #c62828; }

        .btn-agregar {
            background: transparent;
            border: 2px dashed #00b4db;
            border-radius: 14px;
            padding: 12px;
            width: 100%;
            text-align: center;
            color: #00b4db;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-agregar:active {
            transform: scale(0.98);
            background: rgba(0,180,219,0.05);
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.85rem;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.85rem;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            padding: 16px 22px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            box-shadow: 0 4px 12px rgba(0,180,219,0.3);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #00b4db;
            color: #0083b0;
        }

        .button-group {
            display: flex;
            gap: 14px;
            margin-top: 20px;
        }

        /* ========== NUEVA INTERFAZ DE BÚSQUEDA - SIEMPRE DESPLEGADA ========== */
        .search-container {
            margin-bottom: 20px;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input-wrapper i {
            position: absolute;
            left: 18px;
            color: #00b4db;
            font-size: 1.1rem;
        }

        .search-input-wrapper input {
            padding-left: 50px;
            background: white;
            border: 2px solid #e8e8e8;
        }

        .search-input-wrapper input:focus {
            border-color: #00b4db;
        }

        .search-stats {
            background: #e3f2fd;
            padding: 10px 15px;
            border-radius: 16px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .result-count {
            font-weight: bold;
            color: #1976d2;
        }

        .clear-search {
            background: none;
            border: none;
            color: #c62828;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Tarjetas de resultado mejoradas - SIEMPRE VISIBLES */
        .result-card {
            background: white;
            border-radius: 20px;
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.2s;
        }

        .result-card:active {
            transform: scale(0.99);
        }

        .result-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .result-name {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .result-badges {
            display: flex;
            gap: 6px;
        }

        .result-badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .result-body {
            padding: 16px;
        }

        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-icon {
            width: 32px;
            color: #00b4db;
            font-size: 1rem;
            text-align: center;
        }

        .info-text {
            flex: 1;
            font-size: 0.9rem;
            color: #333;
        }

        .info-label {
            font-size: 0.7rem;
            color: #888;
            display: block;
        }

        .info-value {
            font-weight: 500;
        }

        /* Secciones siempre visibles (no colapsables) */
        .section-visible {
            margin-top: 12px;
        }

        .section-header {
            background: #f8f9fa;
            padding: 10px 12px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .items-container {
            padding: 5px;
        }

        .item-chip {
            background: #f0f0f0;
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .item-chip:last-child {
            margin-bottom: 0;
        }

        .chip-placa {
            font-family: monospace;
            font-weight: bold;
            color: #00b4db;
        }

        .result-actions {
            padding: 12px 16px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            gap: 12px;
        }

        .action-btn {
            flex: 1;
            background: #f0f0f0;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .action-btn.edit {
            background: #e3f2fd;
            color: #1976d2;
        }

        .action-btn.delete {
            background: #ffebee;
            color: #c62828;
        }

        .highlight {
            background-color: #fff3cd;
            padding: 2px 5px;
            border-radius: 6px;
            font-weight: bold;
        }

        .empty-result {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-result i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        #loadingToast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 0.85rem;
            display: none;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
            padding: 20px;
        }

        /* Scroll suave */
        #listaContainer {
            max-height: 60vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-users"></i> AutoRegistro PRO</h1>
        <div class="stats" id="globalStats">Cargando...</div>
    </div>

    <div id="authStatus" class="auth-status">
        <i class="fas fa-spinner fa-pulse"></i> Conectando...
    </div>

    <div class="tabs">
        <button class="tab-btn" data-tab="registrar">
            <i class="fas fa-user-plus"></i> Dueños
        </button>
        <button class="tab-btn active" data-tab="buscar">
            <i class="fas fa-search"></i> Buscar
        </button>
    </div>

    <!-- Panel Registrar Dueños -->
    <div id="tab-registrar" class="tab-panel">
        <div class="card">
            <div class="card-title"><i class="fas fa-user-plus"></i> Registrar Dueño</div>
            <input type="hidden" id="editId">
            
            <div class="field-group">
                <label><i class="fas fa-user"></i> Nombre del dueño *</label>
                <input type="text" id="nombre" placeholder="Ej: María González">
            </div>

            <div class="field-group">
                <label><i class="fas fa-phone"></i> Teléfono</label>
                <input type="tel" id="telefono" placeholder="Ej: 555-1234">
            </div>

            <div class="field-group">
                <label><i class="fas fa-id-card"></i> Identificación</label>
                <input type="text" id="identificacion" placeholder="Cédula / DNI">
            </div>

            <div class="field-group">
                <label><i class="fas fa-envelope"></i> Correo electrónico</label>
                <input type="email" id="correo" placeholder="correo@ejemplo.com">
            </div>

            <div class="section-title"><i class="fas fa-child"></i> Estudiantes a cargo</div>
            <div class="dynamic-list" id="estudiantesContainer">
                <div id="listaEstudiantes"></div>
                <button type="button" class="btn-agregar" id="agregarEstudianteBtn">
                    <i class="fas fa-plus-circle"></i> Agregar estudiante
                </button>
            </div>

            <div class="section-title"><i class="fas fa-car"></i> Vehículos del dueño</div>
            <div class="dynamic-list" id="vehiculosContainer">
                <div id="listaVehiculos"></div>
                <button type="button" class="btn-agregar" id="agregarVehiculoBtn">
                    <i class="fas fa-plus-circle"></i> Agregar vehículo
                </button>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="guardarBtn"><i class="fas fa-save"></i> Guardar Dueño</button>
                <button class="btn btn-outline" id="cancelarBtn"><i class="fas fa-times"></i> Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Panel Buscar con interfaz mejorada - SIEMPRE DESPLEGADA -->
    <div id="tab-buscar" class="tab-panel active">
        <div class="card">
            <div class="card-title"><i class="fas fa-search"></i> Buscar Dueños</div>
            
            <div class="search-container">
                <div class="search-input-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="buscarInput" placeholder="Buscar por nombre, placa, teléfono o estudiante...">
                </div>
                <div class="search-stats" id="searchStats" style="display: none;">
                    <span><i class="fas fa-chart-line"></i> <span id="resultCount" class="result-count">0</span> resultado(s)</span>
                    <button id="limpiarBusqueda" class="clear-search"><i class="fas fa-times-circle"></i> Limpiar</button>
                </div>
            </div>

            <div id="listaContainer">
                <div class="empty-message"><i class="fas fa-spinner fa-pulse"></i> Cargando registros...</div>
            </div>
        </div>
    </div>

    <footer>
        <i class="fas fa-shield-alt"></i> Datos seguros · Múltiples estudiantes y vehículos por dueño
    </footer>
</div>
<div id="loadingToast"><i class="fas fa-circle-notch fa-spin"></i> Procesando...</div>

<script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
        }
    }
</script>

<script type="module">
    import { initializeApp } from "firebase/app";
    import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "firebase/firestore";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "firebase/auth";

    const firebaseConfig = {
        apiKey: "AIzaSyBPZFMfCwuVrTZVvEGNnEfe1rJohQgVOzI",
        authDomain: "admin-vehiculos-88011.firebaseapp.com",
        projectId: "admin-vehiculos-88011",
        storageBucket: "admin-vehiculos-88011.firebasestorage.app",
        messagingSenderId: "548122701117",
        appId: "1:548122701117:web:69bc9781a18bd0dedc6954"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let owners = [];
    let filtroActual = "";
    let autenticado = false;
    let estudiantesTemp = [];
    let vehiculosTemp = [];

    // Elementos DOM
    const listaContainer = document.getElementById("listaContainer");
    const buscarInput = document.getElementById("buscarInput");
    const limpiarBusqueda = document.getElementById("limpiarBusqueda");
    const searchStats = document.getElementById("searchStats");
    const resultCountSpan = document.getElementById("resultCount");
    const globalStatsSpan = document.getElementById("globalStats");
    const authStatusDiv = document.getElementById("authStatus");
    const editId = document.getElementById("editId");
    const nombre = document.getElementById("nombre");
    const telefono = document.getElementById("telefono");
    const identificacion = document.getElementById("identificacion");
    const correo = document.getElementById("correo");
    const guardarBtn = document.getElementById("guardarBtn");
    const cancelarBtn = document.getElementById("cancelarBtn");
    const loadingToast = document.getElementById("loadingToast");
    const listaEstudiantes = document.getElementById("listaEstudiantes");
    const listaVehiculos = document.getElementById("listaVehiculos");
    const agregarEstudianteBtn = document.getElementById("agregarEstudianteBtn");
    const agregarVehiculoBtn = document.getElementById("agregarVehiculoBtn");

    function formatearPlaca(texto) {
        if (!texto) return "";
        let limpio = texto.toUpperCase().replace(/\s/g, "");
        limpio = limpio.replace(/-/g, "");
        if (limpio.length > 3) {
            return limpio.substring(0, 3) + "-" + limpio.substring(3, 8);
        }
        return limpio;
    }

    function renderizarListaEstudiantes() {
        if (estudiantesTemp.length === 0) {
            listaEstudiantes.innerHTML = '<div style="text-align:center; color:#999; padding:15px;">Sin estudiantes registrados</div>';
            return;
        }
        
        let html = '';
        estudiantesTemp.forEach((est, index) => {
            html += `
                <div class="list-item">
                    <div class="item-info">
                        <div class="item-title"><i class="fas fa-child"></i> ${escapeHtml(est.nombre)}</div>
                        ${est.grado ? `<div class="item-subtitle"><i class="fas fa-graduation-cap"></i> ${escapeHtml(est.grado)}</div>` : ''}
                    </div>
                    <div class="item-actions">
                        <i class="fas fa-edit edit-item" data-index="${index}" data-tipo="estudiante"></i>
                        <i class="fas fa-trash delete-item" data-index="${index}" data-tipo="estudiante"></i>
                    </div>
                </div>
            `;
        });
        listaEstudiantes.innerHTML = html;
        
        document.querySelectorAll('.edit-item[data-tipo="estudiante"]').forEach(icon => {
            icon.addEventListener('click', () => {
                const idx = parseInt(icon.dataset.index);
                const nuevoNombre = prompt("Nombre del estudiante:", estudiantesTemp[idx].nombre);
                if (nuevoNombre && nuevoNombre.trim()) {
                    estudiantesTemp[idx].nombre = nuevoNombre.trim();
                    const nuevoGrado = prompt("Grado del estudiante:", estudiantesTemp[idx].grado || "");
                    if (nuevoGrado !== null) estudiantesTemp[idx].grado = nuevoGrado;
                    renderizarListaEstudiantes();
                }
            });
        });
        
        document.querySelectorAll('.delete-item[data-tipo="estudiante"]').forEach(icon => {
            icon.addEventListener('click', () => {
                if (confirm("¿Eliminar este estudiante?")) {
                    estudiantesTemp.splice(parseInt(icon.dataset.index), 1);
                    renderizarListaEstudiantes();
                }
            });
        });
    }

    function renderizarListaVehiculos() {
        if (vehiculosTemp.length === 0) {
            listaVehiculos.innerHTML = '<div style="text-align:center; color:#999; padding:15px;">Sin vehículos registrados</div>';
            return;
        }
        
        let html = '';
        vehiculosTemp.forEach((veh, index) => {
            html += `
                <div class="list-item">
                    <div class="item-info">
                        <div class="item-title"><i class="fas fa-car"></i> ${escapeHtml(veh.placa)}</div>
                        ${veh.color ? `<div class="item-subtitle"><i class="fas fa-palette"></i> ${escapeHtml(veh.color)}</div>` : ''}
                    </div>
                    <div class="item-actions">
                        <i class="fas fa-edit edit-item" data-index="${index}" data-tipo="vehiculo"></i>
                        <i class="fas fa-trash delete-item" data-index="${index}" data-tipo="vehiculo"></i>
                    </div>
                </div>
            `;
        });
        listaVehiculos.innerHTML = html;
        
        document.querySelectorAll('.edit-item[data-tipo="vehiculo"]').forEach(icon => {
            icon.addEventListener('click', () => {
                const idx = parseInt(icon.dataset.index);
                const nuevaPlaca = prompt("Placa del vehículo:", vehiculosTemp[idx].placa);
                if (nuevaPlaca && nuevaPlaca.trim()) {
                    const nuevaPlacaFormateada = formatearPlaca(nuevaPlaca.trim());
                    const duplicado = vehiculosTemp.some((v, i) => i !== idx && v.placa === nuevaPlacaFormateada);
                    if (duplicado) {
                        alert("Ya existe esa placa para este dueño");
                        return;
                    }
                    vehiculosTemp[idx].placa = nuevaPlacaFormateada;
                    const nuevoColor = prompt("Color del vehículo:", vehiculosTemp[idx].color || "");
                    if (nuevoColor !== null) vehiculosTemp[idx].color = nuevoColor;
                    renderizarListaVehiculos();
                }
            });
        });
        
        document.querySelectorAll('.delete-item[data-tipo="vehiculo"]').forEach(icon => {
            icon.addEventListener('click', () => {
                if (confirm("¿Eliminar este vehículo?")) {
                    vehiculosTemp.splice(parseInt(icon.dataset.index), 1);
                    renderizarListaVehiculos();
                }
            });
        });
    }

    function agregarEstudiante() {
        const nombreEst = prompt("Nombre del estudiante:");
        if (!nombreEst || !nombreEst.trim()) return;
        const grado = prompt("Grado que cursa (opcional):");
        estudiantesTemp.push({
            nombre: nombreEst.trim(),
            grado: grado || ""
        });
        renderizarListaEstudiantes();
    }

    function agregarVehiculo() {
        const placa = prompt("Placa del vehículo:");
        if (!placa || !placa.trim()) return;
        const placaFormateada = formatearPlaca(placa.trim());
        
        if (vehiculosTemp.some(v => v.placa === placaFormateada)) {
            alert("Esta placa ya está agregada para este dueño");
            return;
        }
        
        const color = prompt("Color del vehículo (opcional):");
        vehiculosTemp.push({
            placa: placaFormateada,
            color: color || ""
        });
        renderizarListaVehiculos();
    }

    agregarEstudianteBtn.addEventListener("click", agregarEstudiante);
    agregarVehiculoBtn.addEventListener("click", agregarVehiculo);

    function migrarDatosAntiguos(owner) {
        let modificado = false;
        
        if (!owner.estudiantes && owner.estudiante && owner.estudiante.nombre) {
            owner.estudiantes = [owner.estudiante];
            modificado = true;
        } else if (!owner.estudiantes) {
            owner.estudiantes = [];
        }
        
        if (!owner.vehiculos && owner.placa) {
            owner.vehiculos = [{
                placa: owner.placa,
                color: owner.color || ""
            }];
            modificado = true;
        } else if (!owner.vehiculos) {
            owner.vehiculos = [];
        }
        
        if (modificado) {
            const ownerRef = doc(db, "vehiculos", owner.id);
            updateDoc(ownerRef, {
                estudiantes: owner.estudiantes,
                vehiculos: owner.vehiculos,
                estudiante: null,
                placa: null,
                color: null
            }).catch(console.error);
        }
        
        return owner;
    }

    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabPanels = document.querySelectorAll('.tab-panel');

    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const tabId = btn.dataset.tab;
            tabBtns.forEach(b => b.classList.remove('active'));
            tabPanels.forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        });
    });

    function showLoading(show) {
        loadingToast.style.display = show ? "flex" : "none";
    }

    function updateAuthStatus(user, error = null) {
        if (error) {
            authStatusDiv.classList.remove('success');
            authStatusDiv.style.background = "rgba(198,40,40,0.15)";
            authStatusDiv.style.color = "#ef5350";
            authStatusDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${error.substring(0, 100)}`;
            autenticado = false;
        } else if (user) {
            authStatusDiv.classList.add('success');
            authStatusDiv.style.background = "rgba(76,175,80,0.15)";
            authStatusDiv.style.color = "#4caf50";
            authStatusDiv.innerHTML = `<i class="fas fa-check-circle"></i> ✅ Conectado · Datos seguros`;
            autenticado = true;
            cargarOwners();
        } else {
            authStatusDiv.classList.remove('success');
            authStatusDiv.style.background = "rgba(255,193,7,0.15)";
            authStatusDiv.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Conectando...`;
            autenticado = false;
        }
    }

    function cargarOwners() {
        if (!autenticado) return;
        showLoading(true);
        const q = query(collection(db, "vehiculos"), orderBy("nombre"));
        onSnapshot(q, (snapshot) => {
            owners = [];
            snapshot.forEach(doc => {
                let owner = { id: doc.id, ...doc.data() };
                owner = migrarDatosAntiguos(owner);
                owners.push(owner);
            });
            actualizarEstadisticas();
            aplicarBusqueda();
            showLoading(false);
        }, (error) => {
            console.error(error);
            showLoading(false);
            listaContainer.innerHTML = `<div class="empty-message"><i class="fas fa-exclamation-triangle"></i> Error: ${error.message}</div>`;
        });
    }

    function aplicarBusqueda() {
        const termino = buscarInput.value.trim().toLowerCase();
        filtroActual = termino;
        
        let filtrados = [...owners];
        
        if (termino) {
            filtrados = owners.filter(owner => {
                if (owner.nombre?.toLowerCase().includes(termino)) return true;
                if (owner.telefono?.toLowerCase().includes(termino)) return true;
                if (owner.identificacion?.toLowerCase().includes(termino)) return true;
                if (owner.correo?.toLowerCase().includes(termino)) return true;
                if (owner.vehiculos?.some(v => v.placa?.toLowerCase().includes(termino))) return true;
                if (owner.estudiantes?.some(e => e.nombre?.toLowerCase().includes(termino))) return true;
                return false;
            });
        }
        
        if (termino) {
            searchStats.style.display = "flex";
            resultCountSpan.textContent = filtrados.length;
        } else {
            searchStats.style.display = "none";
        }
        
        renderizarResultados(filtrados, termino);
    }

    function resaltarTexto(texto, busqueda) {
        if (!busqueda || !texto) return escapeHtml(texto);
        const regex = new RegExp(`(${busqueda.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return escapeHtml(texto).replace(regex, '<span class="highlight">$1</span>');
    }

    function renderizarResultados(filtrados, termino) {
        if (filtrados.length === 0) {
            listaContainer.innerHTML = `
                <div class="empty-result">
                    <i class="fas fa-search"></i>
                    <div>No se encontraron resultados</div>
                    <div style="font-size:0.8rem; margin-top:8px;">Prueba con otro término</div>
                </div>
            `;
            return;
        }
        
        let html = "";
        filtrados.forEach(owner => {
            const totalVehiculos = owner.vehiculos?.length || 0;
            const totalEstudiantes = owner.estudiantes?.length || 0;
            const nombreResaltado = resaltarTexto(owner.nombre, termino);
            const telefonoResaltado = termino && owner.telefono?.toLowerCase().includes(termino) ? 
                `<span class="highlight">${escapeHtml(owner.telefono)}</span>` : escapeHtml(owner.telefono);
            const identificacionResaltada = termino && owner.identificacion?.toLowerCase().includes(termino) ? 
                `<span class="highlight">${escapeHtml(owner.identificacion)}</span>` : escapeHtml(owner.identificacion);
            
            html += `
            <div class="result-card">
                <div class="result-header">
                    <div class="result-name">
                        <i class="fas fa-user-circle"></i> ${nombreResaltado}
                    </div>
                    <div class="result-badges">
                        <span class="result-badge"><i class="fas fa-car"></i> ${totalVehiculos}</span>
                        <span class="result-badge"><i class="fas fa-child"></i> ${totalEstudiantes}</span>
                    </div>
                </div>
                <div class="result-body">
                    ${owner.telefono || owner.identificacion || owner.correo ? `
                    <div class="info-row">
                        <div class="info-icon"><i class="fas fa-address-card"></i></div>
                        <div class="info-text">
                            ${owner.telefono ? `<div><span class="info-label">📞 Teléfono</span><div class="info-value">${telefonoResaltado}</div></div>` : ''}
                            ${owner.identificacion ? `<div style="margin-top:8px;"><span class="info-label">🆔 Identificación</span><div class="info-value">${identificacionResaltada}</div></div>` : ''}
                            ${owner.correo ? `<div style="margin-top:8px;"><span class="info-label">✉️ Correo</span><div class="info-value">${escapeHtml(owner.correo)}</div></div>` : ''}
                        </div>
                    </div>
                    ` : ''}
                    
                    <!-- Sección de estudiantes - SIEMPRE VISIBLE -->
                    ${owner.estudiantes && owner.estudiantes.length > 0 ? `
                    <div class="section-visible">
                        <div class="section-header">
                            <i class="fas fa-child"></i> Estudiantes (${owner.estudiantes.length})
                        </div>
                        <div class="items-container">
                            ${owner.estudiantes.map(est => `
                                <div class="item-chip">
                                    <div>
                                        <strong><i class="fas fa-user-graduate"></i> ${resaltarTexto(est.nombre, termino)}</strong>
                                        ${est.grado ? `<div style="font-size:0.7rem; color:#ff9800; margin-top:3px;"><i class="fas fa-graduation-cap"></i> ${escapeHtml(est.grado)}</div>` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                    
                    <!-- Sección de vehículos - SIEMPRE VISIBLE -->
                    ${owner.vehiculos && owner.vehiculos.length > 0 ? `
                    <div class="section-visible">
                        <div class="section-header">
                            <i class="fas fa-car"></i> Vehículos (${owner.vehiculos.length})
                        </div>
                        <div class="items-container">
                            ${owner.vehiculos.map(veh => `
                                <div class="item-chip">
                                    <div>
                                        <span class="chip-placa"><i class="fas fa-car"></i> ${resaltarTexto(veh.placa, termino)}</span>
                                        ${veh.color ? `<span style="margin-left:8px; font-size:0.75rem;"><i class="fas fa-palette"></i> ${escapeHtml(veh.color)}</span>` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                </div>
                <div class="result-actions">
                    <button class="action-btn edit" onclick="window.editarOwnerDesdeGlobal('${owner.id}', ${JSON.stringify(owner).replace(/"/g, '&quot;')})">
                        <i class="fas fa-edit"></i> Editar
                    </button>
                    <button class="action-btn delete" onclick="window.eliminarOwnerDesdeGlobal('${owner.id}', '${escapeHtml(owner.nombre)}')">
                        <i class="fas fa-trash"></i> Eliminar
                    </button>
                </div>
            </div>`;
        });
        
        listaContainer.innerHTML = html;
    }

    async function guardarOwner() {
        if (!autenticado) return;
        
        const id = editId.value;
        const nombreValue = nombre.value.trim();
        
        if (!nombreValue) {
            alert("El nombre del dueño es obligatorio");
            return;
        }
        
        const datos = {
            nombre: nombreValue,
            telefono: telefono.value.trim() || "",
            identificacion: identificacion.value.trim() || "",
            correo: correo.value.trim() || "",
            estudiantes: estudiantesTemp,
            vehiculos: vehiculosTemp,
            actualizado: new Date().toISOString()
        };
        
        showLoading(true);
        try {
            if (id) {
                await updateDoc(doc(db, "vehiculos", id), datos);
                const successMsg = document.createElement('div');
                successMsg.className = 'success-message';
                successMsg.innerHTML = '<i class="fas fa-check-circle"></i> Dueño actualizado correctamente';
                document.querySelector('#tab-registrar .card').insertBefore(successMsg, document.querySelector('#tab-registrar .button-group'));
                setTimeout(() => successMsg.remove(), 3000);
            } else {
                await addDoc(collection(db, "vehiculos"), datos);
                const successMsg = document.createElement('div');
                successMsg.className = 'success-message';
                successMsg.innerHTML = '<i class="fas fa-check-circle"></i> Dueño guardado correctamente';
                document.querySelector('#tab-registrar .card').insertBefore(successMsg, document.querySelector('#tab-registrar .button-group'));
                setTimeout(() => successMsg.remove(), 3000);
            }
            limpiarFormulario();
        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            showLoading(false);
        }
    }

    async function eliminarOwner(id, nombreOwner) {
        if (!autenticado) return;
        if (!confirm(`¿Eliminar al dueño "${nombreOwner}" y TODOS sus datos?`)) return;
        showLoading(true);
        try {
            await deleteDoc(doc(db, "vehiculos", id));
        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            showLoading(false);
        }
    }

    function editarOwner(owner) {
        editId.value = owner.id;
        nombre.value = owner.nombre || "";
        telefono.value = owner.telefono || "";
        identificacion.value = owner.identificacion || "";
        correo.value = owner.correo || "";
        estudiantesTemp = owner.estudiantes ? [...owner.estudiantes] : [];
        vehiculosTemp = owner.vehiculos ? [...owner.vehiculos] : [];
        renderizarListaEstudiantes();
        renderizarListaVehiculos();
        
        document.querySelector('.tab-btn[data-tab="registrar"]').click();
    }

    function limpiarFormulario() {
        editId.value = "";
        nombre.value = "";
        telefono.value = "";
        identificacion.value = "";
        correo.value = "";
        estudiantesTemp = [];
        vehiculosTemp = [];
        renderizarListaEstudiantes();
        renderizarListaVehiculos();
    }

    window.editarOwnerDesdeGlobal = function(id, owner) {
        editarOwner(owner);
    };
    
    window.eliminarOwnerDesdeGlobal = function(id, nombre) {
        eliminarOwner(id, nombre);
    };

    function actualizarEstadisticas() {
        const totalOwners = owners.length;
        const totalVehiculos = owners.reduce((acc, o) => acc + (o.vehiculos?.length || 0), 0);
        const totalEstudiantes = owners.reduce((acc, o) => acc + (o.estudiantes?.length || 0), 0);
        globalStatsSpan.innerHTML = `<i class="fas fa-users"></i> Dueños: ${totalOwners} | 🚗 ${totalVehiculos} | 🎓 ${totalEstudiantes}`;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    guardarBtn.addEventListener("click", guardarOwner);
    cancelarBtn.addEventListener("click", limpiarFormulario);
    
    buscarInput.addEventListener("input", () => aplicarBusqueda());
    limpiarBusqueda.addEventListener("click", () => {
        buscarInput.value = "";
        aplicarBusqueda();
    });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            updateAuthStatus(user);
        } else {
            signInAnonymously(auth)
                .then(u => updateAuthStatus(u.user))
                .catch(e => updateAuthStatus(null, e.message));
        }
    });
</script>
</body>
</html>
